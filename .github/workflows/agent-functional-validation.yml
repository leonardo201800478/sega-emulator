name: Agent 1 - Functional Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**/*.py"
      - "src/sega_emulator/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "setup.py"
      - "setup.cfg"
  push:
    branches: [main]
    paths:
      - "src/**/*.py"
      - "src/sega_emulator/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "setup.py"
      - "setup.cfg"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.14 quality and regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Run functional and regression tests
        run: pytest -q --junitxml=pytest-validation.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-validation-${{ github.run_id }}
          path: pytest-validation.xml
          if-no-files-found: warn
          retention-days: 14
