name: Agent 2 - Integrity and Determinism

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "setup.py"
      - "setup.cfg"
  push:
    branches: [main]
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "setup.py"
      - "setup.cfg"
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Repeatability, imports and package integrity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Run complete test suite - pass 1
        run: pytest -q --junitxml=integrity-pass-1.xml

      - name: Run complete test suite - pass 2
        run: pytest -q --junitxml=integrity-pass-2.xml

      - name: Upload repeatability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-reports-${{ github.run_id }}
          path: integrity-pass-*.xml
          if-no-files-found: warn
          retention-days: 14
