name: Nightly Integrity and Repeatability

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Python package integrity and repeatability
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q src tests tools
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Run complete test suite - pass 1
        run: python -m pytest -q --junitxml=integrity-pass-1.xml
      - name: Run complete test suite - pass 2
        run: python -m pytest -q --junitxml=integrity-pass-2.xml
      - name: Upload repeatability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-reports-${{ github.run_id }}
          path: integrity-pass-*.xml
          if-no-files-found: warn
          retention-days: 14
