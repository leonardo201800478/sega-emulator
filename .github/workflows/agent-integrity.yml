name: Legacy Python Integrity (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Legacy Python integrity regression (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Run complete test suite once
        run: python -m pytest -q --junitxml=integrity.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-report-${{ github.run_id }}
          path: integrity.xml
          if-no-files-found: warn
          retention-days: 14
