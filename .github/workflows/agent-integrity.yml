name: Scheduled Integrity

on:
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Weekly Python integrity regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Run complete test suite once
        run: python -m pytest -q --junitxml=integrity.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-report-${{ github.run_id }}
          path: integrity.xml
          if-no-files-found: warn
          retention-days: 14
