name: Bootstrap SMS debugger lockfile

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  bootstrap-lockfile:
    name: Generate lockfile on an isolated review branch
    if: github.event.label.name == 'bootstrap-sms-debugger-lockfile'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1

      - name: Generate standalone SMS debugger lockfile
        run: cargo generate-lockfile --manifest-path native/sms_debugger/Cargo.toml

      - name: Verify lockfile resolution
        run: cargo metadata --locked --no-deps --format-version 1 --manifest-path native/sms_debugger/Cargo.toml

      - name: Commit only the lockfile to a dedicated branch
        id: publish
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git add native/sms_debugger/Cargo.lock
          if git diff --cached --quiet; then
            echo "No lockfile change was generated."
            exit 1
          fi
          changed="$(git diff --cached --name-only)"
          if [ "$changed" != "native/sms_debugger/Cargo.lock" ]; then
            echo "Unexpected staged paths: $changed"
            exit 1
          fi
          branch="ci/sms-debugger-lockfile-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git commit -m "build: add standalone SMS debugger lockfile"
          git push origin "HEAD:$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
