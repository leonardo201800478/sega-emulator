  vdp-focused:
    name: SMS1 VDP core and machine integration validation
    needs: [changes]
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.vdp == 'true' && needs.changes.outputs.full != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt && rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format shared VDP and SMS machine
        run: cargo fmt --manifest-path Cargo.toml --package sega-video --package sega-sms-core -- --check
      - name: Clippy shared VDP and SMS machine
        run: cargo clippy --release --locked --all-targets -p sega-video -p sega-sms-core -- -D warnings
      - name: Test shared VDP and SMS machine integration
        run: cargo test --release --locked --all-targets -p sega-video -p sega-sms-core

  input-focused:
    name: Input core and console integration validation
    needs: [changes]
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.input == 'true' && needs.changes.outputs.full != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt && rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format input and console integration packages
        run: cargo fmt --manifest-path Cargo.toml --package sega-input-runtime --package sega-sms-core --package sega-sg1000-core -- --check
      - name: Clippy input and console integration
        run: cargo clippy --release --locked --all-targets -p sega-input-runtime -p sega-sms-core -p sega-sg1000-core -- -D warnings
      - name: Test input and console integration
        run: cargo test --release --locked --all-targets -p sega-input-runtime -p sega-sms-core -p sega-sg1000-core

  docs-format:
    name: Documentation patch hygiene
    needs: [changes]
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.docs == 'true' && !(github.event.action == 'labeled' && (github.event.label.name == 'refresh-cargo-lockfiles'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check documentation patch formatting
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA...$HEAD_SHA"
          else
            range="$BASE_SHA..$HEAD_SHA"
          fi
          git diff --check "$range"


  workflow-lint:
    name: GitHub Actions workflow validation
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint v1.7.12 and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="actionlint_1.7.12_linux_amd64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" actionlint
          ./actionlint -version
          ./actionlint -color

  windows-slint-wgpu:
    name: Windows x64 Slint WGPU 30 Vulkan POC
    needs: [changes]
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'labeled' && (github.event.label.name == 'refresh-cargo-lockfiles')) && ((github.event_name == 'workflow_dispatch' && !inputs.refresh_cargo_lockfiles && inputs.validate_slint_desktop) || (github.event_name != 'workflow_dispatch' && needs.changes.outputs.slint_desktop == 'true' && needs.changes.outputs.slint_desktop_present == 'true')) }}
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt && rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test cartridge SRAM and profile crates (Windows x64)
        run: cargo test --release --locked -p sega-media -p sega-save-runtime -p sega-sms-core -p sega-sms-runtime --target x86_64-pc-windows-msvc
      - name: Format Slint desktop POC
        run: cargo fmt --manifest-path native/sega_desktop/Cargo.toml -- --check
      - name: Clippy Slint desktop POC (Windows x64 Release)
        run: cargo clippy --release --locked --all-targets --manifest-path native/sega_desktop/Cargo.toml --target x86_64-pc-windows-msvc -- -D warnings
      - name: Test Slint desktop POC (Windows x64 Release)
        run: cargo test --release --locked --all-targets --manifest-path native/sega_desktop/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Build Slint desktop POC (Windows x64 Release)
        run: cargo build --release --locked --manifest-path native/sega_desktop/Cargo.toml --target x86_64-pc-windows-msvc

  windows-sdl3-input:
    name: Windows SDL3 input validation
    needs: [changes]
    if: github.event_name != 'workflow_dispatch' && (needs.changes.outputs.input == 'true' || needs.changes.outputs.slint_desktop == 'true')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt && rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install pinned SDL3 runtime
        shell: pwsh
        run: ./scripts/install_sdl3_runtime.ps1 -Destination $env:GITHUB_WORKSPACE
      - name: Format SDL3 input runtime
        run: cargo fmt --manifest-path Cargo.toml --package sega-input-runtime -- --check
      - name: Clippy SDL3 input runtime (Windows x64)
        run: cargo clippy --release --locked --all-targets --target x86_64-pc-windows-msvc -p sega-input-runtime -- -D warnings
      - name: Test SDL3 dynamic ABI and input runtime (Windows x64)
        shell: pwsh
        run: |
          cargo test --release --locked --all-targets --target x86_64-pc-windows-msvc -p sega-input-runtime

  windows-tooling:
    name: Windows PowerShell tooling syntax
    needs: [changes]
    if: |
      (github.event_name == 'workflow_dispatch' && !inputs.refresh_cargo_lockfiles) || (github.event_name != 'workflow_dispatch' && (needs.changes.outputs.tooling == 'true' || needs.changes.outputs.slint_desktop == 'true'))
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1

      - name: Parse changed project PowerShell scripts
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $files = @((Get-ChildItem -Path scripts -Filter *.ps1 -Recurse | ForEach-Object FullName)) + @((Get-Item -LiteralPath "atualizar_recompilar_sega_emulator.ps1" -ErrorAction SilentlyContinue | ForEach-Object FullName))
          } else {
            if ($env:EVENT_NAME -eq "pull_request") {
              $range = "$($env:BASE_SHA)...$($env:HEAD_SHA)"
            } else {
              $range = "$($env:BASE_SHA)..$($env:HEAD_SHA)"
            }
            $paths = git diff --name-only $range -- scripts atualizar_recompilar_sega_emulator.ps1
            if ($LASTEXITCODE -ne 0) { throw "Could not discover changed PowerShell scripts" }
            $files = @($paths | Where-Object { $_.EndsWith(".ps1", [System.StringComparison]::OrdinalIgnoreCase) })
            if (-not $files) { Write-Host "No PowerShell scripts changed."; exit 0 }
          }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file): $($_.Message)" }
              throw "PowerShell parse failed: $file"
            }
            Write-Host "PASS $file"
          }

      - name: Parse embedded Windows PowerShell dialogs in Slint host
        shell: pwsh
        run: |
          $source = Get-Content -Raw -LiteralPath "native/sega_desktop/src/main.rs"
          $matches = [regex]::Matches($source, '(?s)const SCRIPT: &str = r#"(.*?)"#;')
          if ($matches.Count -lt 2) {
            throw "Expected embedded ROM and trace PowerShell scripts; found $($matches.Count)."
          }
          foreach ($match in $matches) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput(
              $match.Groups[1].Value,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "Embedded Windows PowerShell script failed parsing."
            }
          }
          Write-Host "PASS: parsed $($matches.Count) embedded Windows PowerShell dialog scripts."

      - name: Audit Cargo workspace and lockfile inventory
        shell: pwsh
        run: |
          ./scripts/project.ps1 audit
          ./scripts/project.ps1 locks
  scheduler-stress:
    name: Scheduler deterministic stress
    needs: [changes]
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.scheduler_stress_profile != 'none') ||
      (github.event_name != 'workflow_dispatch' &&
       (needs.changes.outputs.scheduler == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'scheduler-stress-short') ||
        contains(github.event.pull_request.labels.*.name, 'scheduler-stress-long') ||
        (github.event.action == 'labeled' &&
         (github.event.label.name == 'scheduler-stress-short' ||
          github.event.label.name == 'scheduler-stress-long'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCHEDULER_STRESS_PROFILE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.scheduler_stress_profile || (contains(github.event.pull_request.labels.*.name, 'scheduler-stress-long') && 'long') || ((needs.changes.outputs.scheduler == 'true' || contains(github.event.pull_request.labels.*.name, 'scheduler-stress-short') || github.event.label.name == 'scheduler-stress-short') && 'short') || 'long' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt && rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Compile deterministic stress replay
        run: cargo test --release --locked -p sega-machine-scheduler --test stress_replay --no-run
      - name: Run deterministic stress replay with bounded memory
        shell: bash
        run: |
          set -euo pipefail
          test_bin="$(find target/release/deps -maxdepth 1 -type f -name 'stress_replay-*' -perm -111 -print -quit)"
          test -n "$test_bin"
          if [ "$SCHEDULER_STRESS_PROFILE" = "short" ]; then ulimit -v 524288; else ulimit -v 2097152; fi
          "$test_bin" --ignored --nocapture


  refresh-lockfiles:
    name: Generate Cargo lockfiles (manual artifact; no repository writes)
    needs: [changes]
    if: (github.event_name == 'workflow_dispatch' && inputs.refresh_cargo_lockfiles) || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'refresh-cargo-lockfiles')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - name: Refresh root workspace lockfile
        run: cargo update --workspace
      - name: Refresh standalone audio-output lockfile
        run: cargo update --manifest-path native/audio_output/Cargo.toml
      - name: Refresh standalone legacy application lockfile
        run: cargo update --manifest-path native/sega_app/Cargo.toml
      - name: Verify all lockfiles
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps
          cargo metadata --locked --format-version 1 --no-deps --manifest-path native/audio_output/Cargo.toml
          cargo metadata --locked --format-version 1 --no-deps --manifest-path native/sega_app/Cargo.toml
          test -f Cargo.lock
          test -f native/audio_output/Cargo.lock
          test -f native/sega_app/Cargo.lock
      - name: Upload lockfiles for reviewed integration
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-lockfiles-${{ github.run_id }}
          path: |
            Cargo.lock
            native/audio_output/Cargo.lock
            native/sega_app/Cargo.lock
          if-no-files-found: error
          retention-days: 1



  sms-pacing-rom-build:
    name: SMS frame pacing ROM build (four profiles)
    needs: [changes]
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.sms_pacing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEVKIT_SMS_REVISION: 561bc2cb9829cdf2e31ad8cd43835037c8c44a63
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned SDCC 4.6.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sdcc-4.6.0.tar.bz2"
          curl --fail --location --connect-timeout 20 --max-time 180 \
            --retry 2 --retry-all-errors --retry-max-time 240 \
            "https://downloads.sourceforge.net/project/sdcc/sdcc-linux-amd64/4.6.0/sdcc-4.6.0-amd64-unknown-linux2.5.tar.bz2" \
            --output "$archive"
          mkdir -p "$RUNNER_TEMP/sdcc"
          tar -xjf "$archive" -C "$RUNNER_TEMP/sdcc"
          sdcc_bin="$(find "$RUNNER_TEMP/sdcc" -type f -path '*/bin/sdcc' -print -quit)"
          if [[ -z "$sdcc_bin" ]]; then
            echo "SDCC binary was not found in the official 4.6.0 archive" >&2
            exit 1
          fi
          echo "SDCC_BIN=$sdcc_bin" >> "$GITHUB_ENV"
          dirname "$sdcc_bin" >> "$GITHUB_PATH"
          "$sdcc_bin" --version

      - name: Checkout pinned devkitSMS
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/sverx/devkitSMS.git "$RUNNER_TEMP/devkitSMS"
          git -C "$RUNNER_TEMP/devkitSMS" fetch --depth 1 origin "$DEVKIT_SMS_REVISION"
          git -C "$RUNNER_TEMP/devkitSMS" checkout --detach "$DEVKIT_SMS_REVISION"
          echo "DEVKIT_SMS_ROOT=$RUNNER_TEMP/devkitSMS" >> "$GITHUB_ENV"
          echo "OUT_DIR=$RUNNER_TEMP/sms-pacing-rom-output" >> "$GITHUB_ENV"

      - name: Build all four deterministic workload ROMs
        shell: bash
        run: bash tests/sms/pacing-rom/build.sh

      - name: Validate build provenance and profile outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$OUT_DIR" "$DEVKIT_SMS_REVISION" <<'PY'
          import hashlib
          import os
          import pathlib
          import subprocess
          import sys

          output = pathlib.Path(sys.argv[1])
          expected_revision = sys.argv[2]
          expected_commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          expected_cc_version = subprocess.check_output(
              ["cc", "--version"], text=True, stderr=subprocess.STDOUT
          ).splitlines()[0]
          sdcc_version_lines = subprocess.check_output(
              ["sdcc", "--version"], text=True, stderr=subprocess.STDOUT
          ).splitlines()
          expected_sdcc_version_line = next(
              (line for line in sdcc_version_lines if "TD- 4.6.0" in line),
              "",
          )
          if not expected_sdcc_version_line:
              raise SystemExit("SDCC 4.6.0 version line not found")
          devkit = pathlib.Path(os.environ["DEVKIT_SMS_ROOT"])
          source = pathlib.Path("tests/sms/pacing-rom/src/main.c")
          profiles = {
              "cpu-light": "0",
              "cpu-fixed": "1",
              "vdp-sprites": "2",
              "combined": "3",
          }
          sha256 = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          expected_inputs = {
              "source_sha256": sha256(source),
              "makesms_source_sha256": sha256(
                  devkit / "tools/makesms/src/makesms.c"
              ),
              "makesms_sha256": sha256(output / "makesms"),
              "crt0_sha256": sha256(devkit / "crt0/crt0_sms.rel"),
              "peep_rules_sha256": sha256(devkit / "SMSlib/src/peep-rules.txt"),
          }
          expected_flags = {
              "converter_flags": "-std=c11 -D_DEFAULT_SOURCE -O2 -Wall -Wextra",
              "smslib_compile_flags": (
                  "-c -mz80 --max-allocs-per-node=100000 "
                  "--peep-file=SMSlib/src/peep-rules.txt"
              ),
              "link_flags": "-mz80 --no-std-crt0 --data-loc=0xC000",
          }
          hashes = set()

          for profile, profile_value in profiles.items():
              rom = output / f"{profile}.sms"
              ihx = output / f"{profile}.ihx"
              info = output / f"{profile}.build-info.txt"
              if not rom.is_file() or not ihx.is_file() or not info.is_file():
                  raise SystemExit(f"missing ROM/IHX/build metadata for {profile}")
              data = rom.read_bytes()
              if len(data) != 16384:
                  raise SystemExit(f"invalid ROM size for {profile}: {len(data)}")
              metadata = dict(
                  line.split("=", 1)
                  for line in info.read_text().splitlines()
                  if "=" in line
              )
              expected_source_flags = (
                  "-c -mz80 --peep-file=SMSlib/src/peep-rules.txt "
                  f"-DPACING_PROFILE={profile_value}"
              )
              expected = {
                  "profile": profile,
                  "profile_value": profile_value,
                  "region": "USA_NTSC",
                  "project_commit": expected_commit,
                  "devkitsms_revision": expected_revision,
                  "sdcc_version": "4.6.0",
                  "sdcc_version_line": expected_sdcc_version_line,
                  "host_cc_version": expected_cc_version,
                  "source_compile_flags": expected_source_flags,
                  **expected_flags,
                  **expected_inputs,
                  "rom_size": str(len(data)),
                  "ihx_sha256": sha256(ihx),
                  "rom_sha256": sha256(rom),
              }
              for field, value in expected.items():
                  if metadata.get(field) != value:
                      raise SystemExit(
                          f"{profile}: {field} mismatch "
                          f"(expected {value!r}, got {metadata.get(field)!r})"
                      )
              hashes.add(metadata["rom_sha256"])
              print(
                  f"PASS {profile}: {len(data)} bytes "
                  f"sha256={metadata['rom_sha256']}"
              )

          if len(hashes) != len(profiles):
              raise SystemExit("workload profiles unexpectedly produced identical ROMs")
          PY

      - name: Upload ROMs and provenance as CI artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sms-frame-pacing-roms-${{ github.run_id }}
          path: |
            ${{ env.OUT_DIR }}/*.sms
            ${{ env.OUT_DIR }}/*.build-info.txt
          if-no-files-found: error
          retention-days: 7

  quality-gate:
    name: Rust quality and unit regression
    needs:
      - changes
      - rust-workspace
      - z80-focused
      - psg-focused
      - vdp-focused
      - input-focused
      - docs-format
      - workflow-lint
      - windows-slint-wgpu
      - windows-sdl3-input
      - windows-tooling
      - scheduler-stress
      - refresh-lockfiles
      - windows-cpal-output
      - sms-pacing-rom-build
    if: always() && !(github.event_name == 'workflow_dispatch' && inputs.refresh_cargo_lockfiles) && !(github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'refresh-cargo-lockfiles')
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any applicable validation failed or was cancelled
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          EXPECT_RUST_WORKSPACE: ${{ (github.event_name == 'workflow_dispatch' && !inputs.refresh_cargo_lockfiles) || (github.event_name != 'workflow_dispatch' && (needs.changes.outputs.other_rust == 'true' || needs.changes.outputs.full == 'true')) }}
          RUST_WORKSPACE: ${{ needs.rust-workspace.result }}
          EXPECT_Z80: ${{ github.event_name != 'workflow_dispatch' && needs.changes.outputs.z80 == 'true' }}
          Z80: ${{ needs.z80-focused.result }}
          EXPECT_PSG: ${{ github.event_name != 'workflow_dispatch' && needs.changes.outputs.psg == 'true' && needs.changes.outputs.full != 'true' }}
          PSG: ${{ needs.psg-focused.result }}
          EXPECT_VDP: ${{ github.event_name != 'workflow_dispatch' && needs.changes.outputs.vdp == 'true' && needs.changes.outputs.full != 'true' }}
          VDP: ${{ needs.vdp-focused.result }}
          EXPECT_INPUT_FOCUSED: ${{ github.event_name != 'workflow_dispatch' && needs.changes.outputs.input == 'true' && needs.changes.outputs.full != 'true' }}
          INPUT_FOCUSED: ${{ needs.input-focused.result }}
          EXPECT_DOCS: ${{ github.event_name != 'workflow_dispatch' && needs.changes.outputs.docs == 'true' }}
          DOCS: ${{ needs.docs-format.result }}
          EXPECT_WORKFLOW_LINT: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.ci == 'true' }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          EXPECT_WINDOWS_SLINT_WGPU: ${{ (github.event_name == 'workflow_dispatch' && !inputs.refresh_cargo_lockfiles && inputs.validate_slint_desktop) || (github.event_name != 'workflow_dispatch' && needs.changes.outputs.slint_desktop == 'true' && needs.changes.outputs.slint_desktop_present == 'true') }}
          WINDOWS_SLINT_WGPU: ${{ needs.windows-slint-wgpu.result }}
          EXPECT_WINDOWS_SDL3_INPUT: ${{ github.event_name != 'workflow_dispatch' && (needs.changes.outputs.input == 'true' || needs.changes.outputs.slint_desktop == 'true') }}
          WINDOWS_SDL3_INPUT: ${{ needs.windows-sdl3-input.result }}
          EXPECT_WINDOWS_TOOLING: ${{ (github.event_name == 'workflow_dispatch' && !inputs.refresh_cargo_lockfiles) || (github.event_name != 'workflow_dispatch' && (needs.changes.outputs.tooling == 'true' || needs.changes.outputs.slint_desktop == 'true')) }}
          WINDOWS_TOOLING: ${{ needs.windows-tooling.result }}
          EXPECT_SCHEDULER: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.scheduler_stress_profile != 'none') || (github.event_name != 'workflow_dispatch' && (needs.changes.outputs.scheduler == 'true' || contains(github.event.pull_request.labels.*.name, 'scheduler-stress-short') || contains(github.event.pull_request.labels.*.name, 'scheduler-stress-long') || (github.event.action == 'labeled' && (github.event.label.name == 'scheduler-stress-short' || github.event.label.name == 'scheduler-stress-long')))) }}
          SCHEDULER: ${{ needs.scheduler-stress.result }}
          EXPECT_WINDOWS_CPAL_OUTPUT: ${{ needs.changes.outputs.audio == 'true' }}
          WINDOWS_CPAL_OUTPUT: ${{ needs.windows-cpal-output.result }}
          EXPECT_SMS_PACING_ROM: ${{ github.event_name != 'workflow_dispatch' && needs.changes.outputs.sms_pacing == 'true' }}
          SMS_PACING_ROM: ${{ needs.sms-pacing-rom-build.result }}
        run: |
          set -euo pipefail
          check_job() {
            local name="$1"
            local expected="$2"
            local actual="$3"
            if [[ "$expected" == "true" ]]; then
              if [[ "$actual" != "success" ]]; then
                echo "Required validation '$name' expected success but got '$actual'."
                exit 1
              fi
              echo "PASS $name"
            else
              if [[ "$actual" != "skipped" ]]; then
                echo "Unexpected validation '$name' ran (result: '$actual'); review impact filters."
                exit 1
              fi
              echo "NOT RUN (not applicable): $name"
            fi
          }
          if [[ "$CHANGES" != "success" ]]; then
            echo "Change classification did not succeed: $CHANGES"
            exit 1
          fi
          check_job "Rust workspace" "$EXPECT_RUST_WORKSPACE" "$RUST_WORKSPACE"
          check_job "Z80 focused" "$EXPECT_Z80" "$Z80"
          check_job "PSG focused" "$EXPECT_PSG" "$PSG"
          check_job "VDP focused" "$EXPECT_VDP" "$VDP"
          check_job "Input focused" "$EXPECT_INPUT_FOCUSED" "$INPUT_FOCUSED"
          check_job "Documentation" "$EXPECT_DOCS" "$DOCS"
          check_job "Workflow lint" "$EXPECT_WORKFLOW_LINT" "$WORKFLOW_LINT"
          check_job "Windows Slint WGPU Vulkan POC" "$EXPECT_WINDOWS_SLINT_WGPU" "$WINDOWS_SLINT_WGPU"
          check_job "Windows SDL3 input" "$EXPECT_WINDOWS_SDL3_INPUT" "$WINDOWS_SDL3_INPUT"
          check_job "PowerShell tooling" "$EXPECT_WINDOWS_TOOLING" "$WINDOWS_TOOLING"
          check_job "Scheduler stress" "$EXPECT_SCHEDULER" "$SCHEDULER"
          check_job "Windows x64 CPAL audio output" "$EXPECT_WINDOWS_CPAL_OUTPUT" "$WINDOWS_CPAL_OUTPUT"
          check_job "SMS frame pacing ROM build" "$EXPECT_SMS_PACING_ROM" "$SMS_PACING_ROM"

  windows-cpal-output:
    name: Windows x64 CPAL audio output
    needs: [changes]
    if: needs.changes.outputs.audio == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt && rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format CPAL output crate
        run: cargo fmt --manifest-path native/audio_output/Cargo.toml -- --check
      - name: Clippy CPAL output crate (Windows x64 Release)
        run: cargo clippy --release --locked --all-targets --manifest-path native/audio_output/Cargo.toml --target x86_64-pc-windows-msvc -- -D warnings
      - name: Test CPAL output crate (Windows x64 Release)
        run: cargo test --release --locked --all-targets --manifest-path native/audio_output/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Format legacy shell using CPAL
        run: cargo fmt --manifest-path native/sega_app/Cargo.toml -- --check
      - name: Clippy legacy shell using CPAL (Windows x64 Release)
