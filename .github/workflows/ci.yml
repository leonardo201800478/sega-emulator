name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust formatter temporarily
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Checkout PR branch for temporary formatting commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: vdp-format-worktree
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Format Rust sources on the feature branch
        if: github.event_name == 'pull_request'
        working-directory: vdp-format-worktree
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/sms_core/src
          if ! git diff --cached --quiet; then
            git commit -m "Format SMS VDP source"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$CURRENT_SHA"
          else
            ruff format --check .
            exit $?
          fi

          mapfile -d '' changed_python_files < <(git diff --diff-filter=ACMRT --name-only -z "$base_sha" "$head_sha" -- '*.py' ':!legacy/**')
          if (("${#changed_python_files[@]}" == 0)); then
            echo "No changed Python files to format-check."
            exit 0
          fi
          ruff format --check "${changed_python_files[@]}"
      - name: Lint
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$CURRENT_SHA"
          else
            ruff check .
            exit $?
          fi

          mapfile -d '' changed_python_files < <(git diff --diff-filter=ACMRT --name-only -z "$base_sha" "$head_sha" -- '*.py' ':!legacy/**')
          if (("${#changed_python_files[@]}" == 0)); then
            echo "No changed Python files to lint."
            exit 0
          fi
          ruff check "${changed_python_files[@]}"
      - name: Run tests
        run: python -m pytest
