            --event-tone 2 artifacts/baseline-tone-p2.wav artifacts/current-tone-p2.wav artifacts/event-tone-p2.wav \
            --event-tone 3 artifacts/baseline-tone-p3.wav artifacts/current-tone-p3.wav artifacts/event-tone-p3.wav \
            --event-tone 4 artifacts/baseline-tone-p4.wav artifacts/current-tone-p4.wav artifacts/event-tone-p4.wav \
            --event-tone 5 artifacts/baseline-tone-p5.wav artifacts/current-tone-p5.wav artifacts/event-tone-p5.wav \
            --event-tone 6 artifacts/baseline-tone-p6.wav artifacts/current-tone-p6.wav artifacts/event-tone-p6.wav \
            --event-tone 7 artifacts/baseline-tone-p7.wav artifacts/current-tone-p7.wav artifacts/event-tone-p7.wav \
            --event-tone 9 artifacts/baseline-tone-p9.wav artifacts/current-tone-p9.wav artifacts/event-tone-p9.wav \
            --event-tone 14 artifacts/baseline-tone-p14.wav artifacts/current-tone-p14.wav artifacts/event-tone-p14.wav \
            --event-tone 28 artifacts/baseline-tone-p28.wav artifacts/current-tone-p28.wav artifacts/event-tone-p28.wav \
            --event-tone 56 artifacts/baseline-tone-p56.wav artifacts/current-tone-p56.wav artifacts/event-tone-p56.wav \
            --event-tone 112 artifacts/baseline-tone-p112.wav artifacts/current-tone-p112.wav artifacts/event-tone-p112.wav \
            --event-tone 255 artifacts/baseline-tone-p255.wav artifacts/current-tone-p255.wav artifacts/event-tone-p255.wav \
            --event-tone 512 artifacts/baseline-tone-p512.wav artifacts/current-tone-p512.wav artifacts/event-tone-p512.wav \
