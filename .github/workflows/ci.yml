name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scheduler_stress_profile:
        description: "Optional deterministic Scheduler stress profile"
        required: false
        type: choice
        options: [none, short, long]
        default: none
      refresh_cargo_lockfiles:
        description: "Generate updated Cargo.lock files and upload them as an artifact"
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change impact classification
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      windows_native: ${{ steps.filter.outputs.windows_native }}
      scheduler: ${{ steps.filter.outputs.scheduler }}
      tooling: ${{ steps.filter.outputs.tooling }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3 (Node.js 24)
        with:
          filters: |
            rust:
              - 'rust/**/*.rs'
              - 'rust/**/Cargo.toml'
              - 'native/**/*.rs'
              - 'native/sega_app/**'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'build.rs'
            windows_native:
              - 'rust/runtime/sms-runtime/**'
              - 'native/video_runtime/**'
              - 'native/audio_output/**'
              - 'native/audio_runtime/**'
              - 'native/sega_app/**'
              - 'rust-toolchain*'
            scheduler:
              - 'native/machine_scheduler/**'
              - 'native/temporal_core/**'
            tooling:
              - 'scripts/**/*.ps1'
            full:
              - '.github/workflows/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.cargo/**'
              - 'scripts/common.ps1'

      - name: CI supervisor - cancel remaining jobs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
  rust:
    needs: [changes]
    # Required by the main ruleset: run on every PR; do not path-filter.
    if: |
      always() &&
      (github.event_name != 'workflow_dispatch' || !inputs.refresh_cargo_lockfiles)
    name: Rust quality and unit regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Discover and validate active Cargo workspaces
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps
          cargo metadata --locked --format-version 1 --no-deps --manifest-path native/audio_output/Cargo.toml
          cargo metadata --locked --format-version 1 --no-deps --manifest-path native/sega_app/Cargo.toml
          test -f Cargo.lock
          test -f native/audio_output/Cargo.lock
          test -f native/sega_app/Cargo.lock
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace unit tests
        run: cargo test --workspace --locked

      - name: CI supervisor - cancel remaining jobs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
  refresh-lockfiles:
    name: Refresh Cargo lockfiles (manual artifact)
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_cargo_lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Refresh root workspace dependencies
        run: cargo update --workspace
      - name: Refresh standalone audio-output workspace
        run: cargo update --manifest-path native/audio_output/Cargo.toml
      - name: Verify refreshed lockfiles
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps
          cargo metadata --locked --format-version 1 --no-deps --manifest-path native/audio_output/Cargo.toml
          cargo metadata --locked --format-version 1 --no-deps --manifest-path native/sega_app/Cargo.toml
          test -f Cargo.lock
          test -f native/audio_output/Cargo.lock
          test -f native/sega_app/Cargo.lock
      - name: Upload generated Cargo lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lockfiles-${{ github.run_id }}
          path: |
            Cargo.lock
            native/audio_output/Cargo.lock
          if-no-files-found: error
          retention-days: 1

      - name: CI supervisor - cancel remaining jobs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
  scheduler-stress:
    needs: [changes]
    name: Scheduler deterministic stress
    if: |
      always() &&
      (github.event_name != 'workflow_dispatch' || !inputs.refresh_cargo_lockfiles) &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.scheduler_stress_profile != 'none') ||
        (github.event_name == 'pull_request' && (
          needs.changes.outputs.scheduler == 'true' ||
          needs.changes.outputs.full == 'true' ||
          contains(github.event.pull_request.labels.*.name, 'scheduler-stress-short') ||
          contains(github.event.pull_request.labels.*.name, 'scheduler-stress-long') ||
          (github.event.action == 'labeled' && (
            github.event.label.name == 'scheduler-stress-short' ||
            github.event.label.name == 'scheduler-stress-long'
          ))
        ))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCHEDULER_STRESS_PROFILE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.scheduler_stress_profile || (contains(github.event.pull_request.labels.*.name, 'scheduler-stress-long') && 'long') || ((needs.changes.outputs.scheduler == 'true' || needs.changes.outputs.full == 'true' || contains(github.event.pull_request.labels.*.name, 'scheduler-stress-short') || github.event.label.name == 'scheduler-stress-short') && 'short') || 'long' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Compile deterministic stress replay
        run: cargo test -p sega-machine-scheduler --test stress_replay --no-run
      - name: Run deterministic stress replay with bounded memory
        run: |
          test_bin="$(find target/debug/deps -maxdepth 1 -type f -name 'stress_replay-*' -perm -111 -print -quit)"
          test -n "$test_bin"
          if [ "$SCHEDULER_STRESS_PROFILE" = "short" ]; then ulimit -v 524288; else ulimit -v 2097152; fi
          "$test_bin" --ignored --nocapture

      - name: CI supervisor - cancel remaining jobs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
  windows-tooling:
    needs: [changes]
    if: |
      always() &&
      (github.event_name != 'pull_request' ||
       needs.changes.outputs.tooling == 'true' ||
       needs.changes.outputs.full == 'true') &&
      (github.event_name != 'workflow_dispatch' || !inputs.refresh_cargo_lockfiles)
    name: Windows PowerShell tooling syntax
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Parse all project PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path scripts -Filter *.ps1 -Recurse
          if (-not $files) { throw "No PowerShell scripts found under scripts/" }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.FullName): $($_.Message)" }
              throw "PowerShell parse failed: $($file.FullName)"
            }
            Write-Host "PASS $($file.FullName)"
          }

      - name: CI supervisor - cancel remaining jobs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
  windows-d3d12:
    needs: [changes]
    # Required by the main ruleset: run on every PR; do not path-filter.
    if: |
      always() &&
      (github.event_name != 'workflow_dispatch' || !inputs.refresh_cargo_lockfiles)
    name: Windows x64 D3D12 compile
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate PowerShell Cargo workspace discovery and lockfiles
        shell: pwsh
        run: |
          ./scripts/project.ps1 audit
          ./scripts/project.ps1 locks
      - name: Format native egui application
        run: cargo fmt --all --manifest-path native/sega_app/Cargo.toml -- --check
      - name: Check native egui application
        run: cargo check --locked --all-targets --manifest-path native/sega_app/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Clippy native egui application
        run: cargo clippy --locked --all-targets --manifest-path native/sega_app/Cargo.toml --target x86_64-pc-windows-msvc -- -D warnings
      - name: Test native egui application headlessly
        run: cargo test --locked --all-targets --manifest-path native/sega_app/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Compile SMS temporal runtime with Windows D3D12
        run: cargo check --locked --all-targets -p sega-sms-runtime --target x86_64-pc-windows-msvc
      - name: Clippy SMS temporal runtime with Windows D3D12
        run: cargo clippy --locked --all-targets -p sega-sms-runtime --target x86_64-pc-windows-msvc -- -D warnings
      - name: Compile native video runtime for Windows x64
        run: cargo check --locked --all-targets -p sega-video-runtime --target x86_64-pc-windows-msvc
      - name: Clippy native video runtime for Windows x64
        run: cargo clippy --locked --all-targets -p sega-video-runtime --target x86_64-pc-windows-msvc -- -D warnings
      - name: Run Windows video-runtime unit tests
        run: cargo test --locked -p sega-video-runtime --target x86_64-pc-windows-msvc
      - name: Compile native WASAPI and XAudio2 output
        run: cargo check --locked --all-targets --manifest-path native/audio_output/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Clippy native WASAPI and XAudio2 output
        run: cargo clippy --locked --all-targets --manifest-path native/audio_output/Cargo.toml --target x86_64-pc-windows-msvc -- -D warnings
      - name: Run native audio-output unit tests
        run: cargo test --locked --manifest-path native/audio_output/Cargo.toml --target x86_64-pc-windows-msvc

      - name: CI supervisor - cancel remaining jobs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  temp-app-lock-refresh:
    # Temporary lockfile regeneration aid for the SMS app integration PR.
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/rust-app-sms-runtime-viewport-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Resolve standalone sega-app lockfile
        run: cargo metadata --format-version 1 --manifest-path native/sega_app/Cargo.toml > /dev/null
      - name: Upload resolved sega-app lockfile
        uses: actions/upload-artifact@v4
        with:
          name: sega-app-lockfile-preview
          path: native/sega_app/Cargo.lock
          if-no-files-found: error
          retention-days: 1
