          cmp artifacts/psg-noise-rates-crabemu.jsonl "$RUNNER_TEMP/psg-noise-rates-crabemu-repeat.jsonl"
          cmp artifacts/psg-noise-rates-core.jsonl "$RUNNER_TEMP/psg-noise-rates-core-repeat.jsonl"
          cmp artifacts/psg-noise-rates-gearsystem.jsonl "$RUNNER_TEMP/psg-noise-rates-gearsystem-repeat.jsonl"
          cmp artifacts/psg-noise-rates-ares.jsonl "$RUNNER_TEMP/psg-noise-rates-ares-repeat.jsonl"

      - name: Compare noise-rate transitions and Tone 2 tracking at identical ticks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/psg-crabemu-oracle/compare.py \
            artifacts/psg-noise-rates-crabemu.jsonl \
            artifacts/psg-noise-rates-core.jsonl \
            artifacts/psg-noise-rates-gearsystem.jsonl \
            artifacts/psg-noise-rates-ares.jsonl \
            > artifacts/psg-noise-rates-comparison.json
          cat artifacts/psg-noise-rates-comparison.json

      - name: Compare same-tick PSG traces without waveform alignment
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/psg-crabemu-oracle/compare.py \
            artifacts/psg-crabemu-reference.jsonl \
            artifacts/psg-crabemu-core.jsonl \
            artifacts/psg-gearsystem-reference.jsonl \
            artifacts/psg-ares-reference.jsonl \
            > artifacts/psg-crabemu-comparison.json
          cat artifacts/psg-crabemu-comparison.json

      - name: Validate CrabEmu trace schema and known diagnostic schedule
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json

          def read(path):
              with open(path, encoding="utf-8") as stream:
                  return [json.loads(line) for line in stream if line.strip()]

          reference = read("artifacts/psg-crabemu-reference.jsonl")
          core = read("artifacts/psg-crabemu-core.jsonl")
          gear = read("artifacts/psg-gearsystem-reference.jsonl")
          ares = read("artifacts/psg-ares-reference.jsonl")
          with open("artifacts/psg-crabemu-comparison.json", encoding="utf-8") as stream:
              summary = json.load(stream)

          assert len(reference) == 601, len(reference)
          assert len(core) == 601, len(core)
          assert len(gear) == 601, len(gear)
          assert len(ares) == 601, len(ares)
          assert reference[0]["schema"] == "smsplus-crabemu-psg-trace-v1"
          assert core[0]["schema"] == "sega-sn76489-core-state-trace-v1"
          assert gear[0]["schema"] == "gearsystem-sms-psg-state-trace-v1"
          assert ares[0]["schema"] == "ares-sn76489-state-trace-v1"
          assert ares[0]["source_commit"] == "8bc30c8c3d3c8081d2a66587add602df771441dd"
          assert ares[0]["time_unit"] == "sn76489_component_clock"
          assert reference[0]["source_commit"] == "3844b46caa926b6494987b97da63092818c4ddef"
          assert gear[0]["source_commit"] == "1be9a12b82cae84ddd6f9b7006d546abe2d58bd4"
          assert reference[0]["noise_bits"] == 16
          assert reference[0]["noise_tapped"] == 9
          assert summary["ticks_compared"] == 600
          assert summary["ares"]["same_tick_comparison"] is True
          assert summary["ares"]["lfsr_raw_state_comparable"] is True
          assert summary["ares"]["commit"] == "8bc30c8c3d3c8081d2a66587add602df771441dd"
          assert "tone_counter" in summary["ares"]["field_mismatch_counts"]
          assert "noise_output_post" in summary["ares"]["field_mismatch_counts"]

          # CrabEmu starts with a zero noise counter and positive noise flip-flop.
          assert summary["reference_first_lfsr_shift_tick"] == 16
          # The current core starts with a 16-count divider and phase zero.
          assert summary["core_first_lfsr_shift_tick"] == 15
          # Gearsystem's persistent initial delay is zero; its first run_until
          # advances the Galois LFSR at the beginning of the first frame.
          assert summary["gearsystem"]["first_lfsr_shift_tick"] == 0
          assert summary["gearsystem"]["galois_state_raw_values_compared"] is False

          # Keep sample/bit output conventions visible as diagnostic deltas.
          assert summary["reference_sample_vs_core_noise_output_latch_mismatch_count"] > 0

          # Ares powers up with zero noise counter/flip; first component call
          # clocks the first LFSR shift. Preserve this as an observed source fact.
          assert ares[1]["lfsr"] == 32768
          assert ares[1]["post_clock"]["lfsr"] == 16384
          assert ares[1]["post_clock"]["noise_flip"] == 1
          assert ares[1]["post_clock"]["noise_output"] == 0
          PY

      - name: Fetch historical PSG baseline
        shell: bash
