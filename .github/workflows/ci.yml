name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace quality and regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --locked

  python-and-extension:
    name: Python quality, native extension and regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]" maturin==1.15.0
      - name: Ruff formatting
        run: python -m ruff format --check .
      - name: Ruff lint
        run: python -m ruff check .
      - name: Build and install native Rust extension
        run: |
          maturin build --locked --manifest-path native/z80_core/Cargo.toml --release --features python-extension --out native/z80_core/dist
          python -m pip install native/z80_core/dist/*.whl
      - name: Compile Python sources
        run: python -m compileall -q src tests tools
      - name: Check Python dependencies
        run: python -m pip check
      - name: Smoke-test SMS boot matrix CLI
        run: python tools/sms_boot_matrix.py --help
      - name: Python regression suite
        run: python -m pytest -q
