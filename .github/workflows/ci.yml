name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scheduler_stress_profile:
        description: "Optional deterministic Scheduler stress profile"
        required: false
        type: choice
        options: [none, short, long]
        default: none
      refresh_cargo_lockfiles:
        description: "Refresh and commit Cargo lockfiles for the current PR"
        required: false
        type: boolean
        default: false
      validate_slint_desktop:
        description: "Opt in to Slint/WGPU Windows x64 validation"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change impact classification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      other_rust: ${{ steps.filter.outputs.other_rust }}
      z80: ${{ steps.filter.outputs.z80 }}
      psg: ${{ steps.filter.outputs.psg }}
      vdp: ${{ steps.filter.outputs.vdp }}
      docs: ${{ steps.filter.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci }}
      video: ${{ steps.filter.outputs.video }}
      audio: ${{ steps.filter.outputs.audio }}
      input: ${{ steps.filter.outputs.input }}
      slint_desktop: ${{ steps.filter.outputs.slint_desktop }}
      slint_desktop_present: ${{ steps.slint_manifest.outputs.present }}
      scheduler: ${{ steps.filter.outputs.scheduler }}
      tooling: ${{ steps.filter.outputs.tooling }}
      sms_pacing: ${{ steps.filter.outputs.sms_pacing }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - name: Checkout history for push path classification
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3 (Node.js 24)
        with:
          base: ${{ github.event_name == 'pull_request' && '' || github.ref }}
          predicate-quantifier: some-with-excludes
          filters: |
            docs:
              - '**/*.md'
              - '**/*.mdx'
              - '**/*.rst'
              - '**/*.txt'
              - 'docs/**'
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/scripts/**'
              - '.actionlint*'
            rust:
              - 'native/**/*.rs'
              - 'rust/**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'build.rs'
            other_rust:
              - 'native/**/*.rs'
              - 'rust/**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'build.rs'
              - '!native/z80_cpu/**'
              - '!native/z80_alu/**'
              - '!native/z80_bus/**'
              - '!native/sms_core/src/cpu.rs'
              - '!native/sms_core/src/alu.rs'
              - '!native/sms_core/src/bus.rs'
              - '!native/sg1000_core/src/cpu.rs'
              - '!native/sg1000_core/src/alu.rs'
              - '!native/sg1000_core/src/bus.rs'
              - '!native/sms_core/tests/z80_*.rs'
              - '!native/sms_core/src/bin/z80test_runner.rs'
              - '!native/sn76489/**'
              - '!native/audio_runtime/**'
              - '!native/video_core/**'
              - '!native/video_runtime/**'
              - '!native/input_runtime/**'
              - '!native/sg1000_core/src/psg.rs'
              - '!native/sg1000_core/src/vdp.rs'
              - '!native/sms_core/src/vdp.rs'
              - '!native/sg1000_core/src/input.rs'
              - '!native/sms_core/src/input.rs'
              - '!native/sega_app/**'
              - '!native/audio_output/**'
              - '!native/sms_debugger/**'
            z80:
              - 'native/z80_cpu/**'
              - 'native/z80_alu/**'
              - 'native/z80_bus/**'
              - 'native/sms_core/src/cpu.rs'
              - 'native/sms_core/src/alu.rs'
              - 'native/sms_core/src/bus.rs'
              - 'native/sg1000_core/src/cpu.rs'
              - 'native/sg1000_core/src/alu.rs'
              - 'native/sg1000_core/src/bus.rs'
              - 'native/sms_core/Cargo.toml'
              - 'native/sg1000_core/Cargo.toml'
              - 'native/sms_core/tests/z80_*.rs'
              - 'native/sms_core/src/temporal*.rs'
              - 'native/sms_core/src/bin/z80test_runner.rs'
              - 'native/sg1000_core/src/temporal*.rs'
            psg:
              - 'native/sn76489/**'
              - 'native/audio_runtime/**'
              - 'native/sg1000_core/src/psg.rs'
            vdp:
              - 'native/video_core/**'
              - 'native/sms_core/src/vdp.rs'
              - 'native/sms_core/src/temporal*.rs'
              - 'native/sms_core/tests/sms_vdp_*.rs'
              - 'native/sg1000_core/src/vdp.rs'
              - 'native/video_core/tests/**'
            video:
              - 'native/video_core/**'
              - 'native/video_runtime/**'
              - 'native/sms_core/src/vdp.rs'
              - 'native/sg1000_core/src/vdp.rs'
              - 'native/observability/**'
            audio:
              - 'native/sn76489/**'
              - 'native/sg1000_core/src/psg.rs'
              - 'native/audio_output/**'
              - 'native/audio_runtime/**'
              - 'native/sega_app/src/app.rs'
              - 'native/sega_app/Cargo.toml'
              - 'native/machine_scheduler/**'
              - 'native/temporal_core/**'
              - 'native/observability/**'
            input:
              - 'native/input_runtime/**'
              - 'native/sms_core/src/input.rs'
              - 'native/sms_core/src/io.rs'
              - 'native/sms_core/src/temporal*.rs'
              - 'native/sg1000_core/src/input.rs'
              - 'native/observability/**'
            slint_desktop:
              - 'native/sega_desktop/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.cargo/**'
            scheduler:
              - 'native/machine_scheduler/**'
              - 'native/temporal_core/**'
              - 'native/sms_core/src/temporal*.rs'
              - 'native/sg1000_core/src/temporal*.rs'
            tooling:
              - 'scripts/**/*.ps1'
              - 'atualizar_recompilar_sega_emulator.ps1'
            sms_pacing:
              - 'tests/sms/pacing-rom/**'
            full:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.cargo/**'
              - 'build.rs'
              - 'scripts/common.ps1'

      - name: Checkout exact commit for capability detection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Detect Slint desktop crate
        id: slint_manifest
        shell: bash
        run: |
          if [ -f native/sega_desktop/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  rust-workspace:
    name: Rust workspace regression
    needs: [changes]
    if: |
      !(github.event_name == 'pull_request' && github.event.action == 'labeled' && ((github.event.label.name == 'refresh-cargo-lockfiles'))) &&
      ((github.event_name == 'workflow_dispatch' && !inputs.refresh_cargo_lockfiles) ||
       (github.event_name != 'workflow_dispatch' &&
        (needs.changes.outputs.other_rust == 'true' ||
         needs.changes.outputs.full == 'true')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy && rustup default 1.99.1
      - name: Validate active Cargo workspaces and lockfiles
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps
          test -f Cargo.lock
          echo "Standalone legacy host workspaces are validated only by their path-scoped jobs."
      - name: Format root Rust workspace
        run: cargo fmt --all -- --check
      - name: Clippy workspace
        run: cargo clippy --release --workspace --all-targets --locked -- -D warnings
      - name: Workspace unit and integration tests
        run: cargo test --release --workspace --locked
      - name: Clippy observability runtime feature
        run: cargo clippy --release --manifest-path native/observability/Cargo.toml --features runtime --all-targets --locked -- -D warnings
      - name: Test observability runtime feature
        run: cargo test --release --manifest-path native/observability/Cargo.toml --features runtime --locked

  z80-focused:
    name: Z80 focused validation
    needs: [changes]
    if: |
      github.event_name != 'workflow_dispatch' &&
      needs.changes.outputs.z80 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy && rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch pinned SingleStepTests Z80 fixtures (MIT)
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="vendor/SingleStepTests-z80"
          fixture_revision="ebe1875d48f374bcfd4b505d8eb8ee751568b5f7"

          git init "$fixture_dir"
          git -C "$fixture_dir" remote add origin https://github.com/SingleStepTests/z80.git
          git -C "$fixture_dir" fetch --filter=blob:none --depth=1 origin "$fixture_revision"
          git -C "$fixture_dir" sparse-checkout init --no-cone
          git -C "$fixture_dir" sparse-checkout set --no-cone \
            'README.MD' \
            'LICENSE' \
            'v1/dd 84.json' \
            'v1/dd 85.json' \
            'v1/dd 8c.json' \
            'v1/dd 8d.json' \
            'v1/dd 94.json' \
            'v1/dd 95.json' \
            'v1/dd 9c.json' \
            'v1/dd 9d.json' \
            'v1/dd a4.json' \
            'v1/dd a5.json' \
            'v1/dd ac.json' \
            'v1/dd ad.json' \
            'v1/dd b4.json' \
            'v1/dd b5.json' \
            'v1/dd bc.json' \
            'v1/dd bd.json' \
            'v1/fd 84.json' \
            'v1/fd 85.json' \
            'v1/fd 8c.json' \
            'v1/fd 8d.json' \
            'v1/fd 94.json' \
            'v1/fd 95.json' \
            'v1/fd 9c.json' \
            'v1/fd 9d.json' \
            'v1/fd a4.json' \
            'v1/fd a5.json' \
            'v1/fd ac.json' \
            'v1/fd ad.json' \
            'v1/fd b4.json' \
            'v1/fd b5.json' \
            'v1/fd bc.json' \
            'v1/fd bd.json' \
            'v1/dd 37.json' \
            'v1/fd 3f.json'
          git -C "$fixture_dir" checkout --detach FETCH_HEAD
          test -f "$fixture_dir/README.MD"
          test -f "$fixture_dir/LICENSE"
          test -f "$fixture_dir/v1/dd 84.json"
          test -f "$fixture_dir/v1/fd 3f.json"
      - name: Format Z80 and console integration packages
        run: cargo fmt --manifest-path Cargo.toml --package sega-z80-cpu --package sega-z80-alu --package sega-z80-bus --package sega-sms-core --package sega-sg1000-core -- --check
      - name: Clippy Z80 and console integration packages
        run: cargo clippy --release --locked --all-targets -p sega-z80-cpu -p sega-z80-alu -p sega-z80-bus -p sega-sms-core -p sega-sg1000-core -- -D warnings
      - name: Test Z80, SMS and SG-1000 integration packages
        run: cargo test --release --locked --all-targets -p sega-z80-cpu -p sega-z80-alu -p sega-z80-bus -p sega-sms-core -p sega-sg1000-core
      - name: Fetch pinned Z80 Block Instruction Flags Test v5.0 fixture (MIT)
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/z80bltst.sna"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/MrKWatkins/ZXSpectrumNextTests/8adcbc8384b2311fb6d36d424478aef583d5c307/Tests/ZX48_ZX128/Z80BlockInstructionFlags/z80bltst.sna" \
            --output "$fixture"
          actual_blob_sha="$(git hash-object "$fixture")"
          test "$actual_blob_sha" = "41b7b0da0f5abfd5d2841fbae005f05291986f8b"
          echo "SEGA_Z80_BLOCK_FLAGS_SNA=$fixture" >> "$GITHUB_ENV"
      - name: Execute hardware-derived Z80 Block Instruction Flags Test v5.0
        run: cargo test --release --locked -p sega-z80-cpu --test z80_block_flags_rom_v5 -- --ignored --nocapture
      - name: Run all pinned SingleStepTests DD/FD indexed ALU vectors
        env:
          SINGLESTEP_Z80_DIR: ${{ github.workspace }}/vendor/SingleStepTests-z80/v1
        run: cargo test --release --locked -p sega-z80-cpu --test singlestep_indexed_alu -- --ignored
      - name: Fetch and verify original ZX Spectrum 48K ROM (Amstrad permission; CI-only)
        shell: bash
        run: |
          set -euo pipefail
          source_file="$RUNNER_TEMP/zx_spectrum_rom.h"
          rom_file="$RUNNER_TEMP/zx_spectrum_48k.rom"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            "https://raw.githubusercontent.com/antirez/ZOT/1cb85abbbd1b5e00d9e2b7c6c2ab87b3f8c11cf3/rom.h" \
            --output "$source_file"
          python - "$source_file" "$rom_file" <<'PY'
          import hashlib
          import pathlib
          import re
          import sys

          source = pathlib.Path(sys.argv[1]).read_bytes()
          expected_blob = "626b8eb763b0964de3b1496f47647a154c1322cb"
          actual_blob = hashlib.sha1(
              b"blob " + str(len(source)).encode("ascii") + b"\0" + source
          ).hexdigest()
          if actual_blob != expected_blob:
              raise SystemExit(f"Spectrum ROM source blob mismatch: {actual_blob}")

          match = re.search(
              rb"unsigned char zx_spectrum_rom\[16384\] = \{(.*?)\};",
              source,
              re.DOTALL,
          )
          if match is None:
              raise SystemExit("Could not locate the pinned 16K Spectrum ROM array")
          rom = bytes(int(value, 16) for value in re.findall(rb"0x([0-9a-fA-F]{2})", match.group(1)))
          if len(rom) != 16384:
              raise SystemExit(f"Spectrum ROM size mismatch: {len(rom)}")
          pathlib.Path(sys.argv[2]).write_bytes(rom)
          print(f"Verified original Spectrum 48K ROM: {len(rom)} bytes; source blob {actual_blob}")
          PY
          echo "Z80_SPECTRUM_ROM=$rom_file" >> "$GITHUB_ENV"
      - name: Fetch and verify Mark Woodmass Z80 MEMPTR TAP (GPL-2.0; CI-only)
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/z80tests.tap"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            "https://zxe.io/depot/software/ZX%20Spectrum/Z80%20Test%20Suite%20%282008%29%28Woodmass%2C%20Mark%29%5B%21%5D.tap" \
            --output "$fixture"
          python - "$fixture" <<'PY'
          import hashlib
          import pathlib
          import sys

          fixture = pathlib.Path(sys.argv[1])
          data = fixture.read_bytes()
          expected = "BB1DCE3187FBF5EA871FE41EB76AE7E0C94D08136FF4D8E756E2624DA589AAE69CAD074EB43CBFB9E2B9E0D2CC505343D9804EDCDE3CEA1FB1881DCBF5C865B0"
          actual = hashlib.sha3_512(data).hexdigest().upper()
          if len(data) != 5573 or actual != expected:
              raise SystemExit(f"Woodmass TAP fixture mismatch: size={len(data)}, sha3-512={actual}")
          print(f"Verified Woodmass TAP: size={len(data)}, sha3-512={actual}")
          PY
          echo "Z80_WOODMASS_TAP=$fixture" >> "$GITHUB_ENV"
      - name: Execute Mark Woodmass hardware-derived MEMPTR test
        run: cargo test --release --locked -p sega-z80-cpu --test z80_woodmass_memptr woodmass_memptr_tap_matches_hardware_reference -- --ignored --exact --nocapture

  psg-focused:
    name: PSG core and console integration validation
    needs: [changes]
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.psg == 'true' && needs.changes.outputs.full != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt && rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format PSG and console audio integration packages
        run: cargo fmt --manifest-path Cargo.toml --package sega-sn76489 --package sega-audio-runtime --package sega-sms-core --package sega-sg1000-core -- --check
      - name: Clippy PSG and console audio integration
        run: cargo clippy --release --locked --all-targets -p sega-sn76489 -p sega-audio-runtime -p sega-sms-core -p sega-sg1000-core -- -D warnings
      - name: Test PSG and console audio integration
        run: |
          mkdir -p artifacts
          PSG_AUDIO_ARTIFACT_DIR="$GITHUB_WORKSPACE/artifacts" cargo test --release --locked --all-targets -p sega-sn76489 -p sega-audio-runtime -p sega-sms-core -p sega-sg1000-core

      - name: Checkout pinned SMS Plus GX CrabEmu oracle
        shell: bash
        run: |
          set -euo pipefail
          reference_sha="3844b46caa926b6494987b97da63092818c4ddef"
          git clone https://github.com/libretro/smsplus-gx.git "$RUNNER_TEMP/smsplus-gx"
          git -C "$RUNNER_TEMP/smsplus-gx" checkout "$reference_sha"
          test "$(git -C "$RUNNER_TEMP/smsplus-gx" rev-parse HEAD)" = "$reference_sha"

      - name: Checkout pinned Gearsystem SMS APU oracle
        shell: bash
        run: |
          set -euo pipefail
          reference_sha="1be9a12b82cae84ddd6f9b7006d546abe2d58bd4"
          git clone https://github.com/drhelius/Gearsystem.git "$RUNNER_TEMP/gearsystem"
          git -C "$RUNNER_TEMP/gearsystem" checkout "$reference_sha"
          test "$(git -C "$RUNNER_TEMP/gearsystem" rev-parse HEAD)" = "$reference_sha"

      - name: Checkout pinned Ares SN76489 oracle
        shell: bash
        run: |
          set -euo pipefail
          reference_sha="8bc30c8c3d3c8081d2a66587add602df771441dd"
          git clone https://github.com/ares-emulator/ares.git "$RUNNER_TEMP/ares"
          git -C "$RUNNER_TEMP/ares" checkout "$reference_sha"
          test "$(git -C "$RUNNER_TEMP/ares" rev-parse HEAD)" = "$reference_sha"

      - name: Compile external Gearsystem state trace adapter
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++11 -O2 -Wall -Wextra -include cassert \
            -I"$RUNNER_TEMP/gearsystem/src/audio" \
            tools/psg-crabemu-oracle/gearsystem_trace.cpp \
            "$RUNNER_TEMP/gearsystem/src/audio/Sms_Apu.cpp" \
            "$RUNNER_TEMP/gearsystem/src/audio/Blip_Buffer.cpp" -lm \
            -o "$RUNNER_TEMP/psg-gearsystem-trace"

      - name: Compile external Ares SN76489 state trace adapter
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++11 -O2 -Wall -Wextra \
            -Itools/psg-crabemu-oracle/ares-shim \
            -I"$RUNNER_TEMP/ares/ares/component/audio/sn76489" \
            tools/psg-crabemu-oracle/ares_trace.cpp \
            "$RUNNER_TEMP/ares/ares/component/audio/sn76489/sn76489.cpp" \
            -o "$RUNNER_TEMP/psg-ares-trace"

      - name: Compile external CrabEmu oracle trace adapter
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra \
            -I"$RUNNER_TEMP/smsplus-gx/source/sound/crabemu_sn76489" \
            tools/psg-crabemu-oracle/trace.c \
            "$RUNNER_TEMP/smsplus-gx/source/sound/crabemu_sn76489/sn76489.c" \
            -o "$RUNNER_TEMP/psg-crabemu-trace"

      - name: Generate clock-stamped PSG write schedule
        shell: bash
        run: |
          set -euo pipefail
          cat > artifacts/psg-crabemu-events.csv <<'EOF'
          # tick,byte
          0,0xE4
          0,0xF0
          540,0xE0
          560,0xE4
          EOF

      - name: Capture pinned CrabEmu and current SMS PSG traces
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/psg-crabemu-trace" \
            --calls 600 --events artifacts/psg-crabemu-events.csv \
            > artifacts/psg-crabemu-reference.jsonl
          cargo run --release --locked -p sega-sn76489 --example psg_state_trace -- \
            --calls 600 --events artifacts/psg-crabemu-events.csv \
            > artifacts/psg-crabemu-core.jsonl
          "$RUNNER_TEMP/psg-crabemu-trace" \
            --calls 600 --events artifacts/psg-crabemu-events.csv \
            > "$RUNNER_TEMP/psg-crabemu-reference-repeat.jsonl"
          cargo run --release --locked -p sega-sn76489 --example psg_state_trace -- \
            --calls 600 --events artifacts/psg-crabemu-events.csv \
            > "$RUNNER_TEMP/psg-crabemu-core-repeat.jsonl"
          cmp artifacts/psg-crabemu-reference.jsonl "$RUNNER_TEMP/psg-crabemu-reference-repeat.jsonl"
          cmp artifacts/psg-crabemu-core.jsonl "$RUNNER_TEMP/psg-crabemu-core-repeat.jsonl"

      - name: Capture Gearsystem SMS PSG state trace
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/psg-gearsystem-trace" \
            --calls 600 --events artifacts/psg-crabemu-events.csv \
            > artifacts/psg-gearsystem-reference.jsonl
          "$RUNNER_TEMP/psg-gearsystem-trace" \
            --calls 600 --events artifacts/psg-crabemu-events.csv \
            > "$RUNNER_TEMP/psg-gearsystem-reference-repeat.jsonl"
          cmp artifacts/psg-gearsystem-reference.jsonl "$RUNNER_TEMP/psg-gearsystem-reference-repeat.jsonl"

      - name: Capture Ares SN76489 component trace
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/psg-ares-trace" \
            --calls 600 --events artifacts/psg-crabemu-events.csv \
