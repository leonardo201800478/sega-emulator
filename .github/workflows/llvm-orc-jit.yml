name: LLVM ORC JIT Prototype

on:
  pull_request:
    paths:
      - "native/llvm_jit/**"
      - "src/sega_emulator/profiles.py"
      - "tests/unit/test_execution_profiles.py"
      - "docs/adr/0002-llvm-orc-jit-fast-mode.md"
      - "docs/adr/0003-execution-profiles.md"
      - ".github/workflows/llvm-orc-jit.yml"
  push:
    branches: ["perf/llvm-orc-jit-fast-mode"]
    paths:
      - "native/llvm_jit/**"
      - "src/sega_emulator/profiles.py"
      - "tests/unit/test_execution_profiles.py"
      - "docs/adr/0002-llvm-orc-jit-fast-mode.md"
      - "docs/adr/0003-execution-profiles.md"
      - ".github/workflows/llvm-orc-jit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llvm-orc-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install LLVM and Ninja
        shell: pwsh
        run: choco install llvm ninja --yes --no-progress
      - name: Configure
        shell: pwsh
        run: |
          $searchRoots = @(
            (Join-Path $env:ProgramFiles "LLVM"),
            (Join-Path ${env:ProgramFiles(x86)} "LLVM")
          ) | Where-Object { Test-Path $_ }
          $config = Get-ChildItem -Path $searchRoots -Filter "LLVMConfig.cmake" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $config) {
            Write-Host "LLVM installation contents:"
            foreach ($root in $searchRoots) { Get-ChildItem -Path $root -Force | Select-Object FullName }
            throw "LLVMConfig.cmake was not found under: $($searchRoots -join ', ')"
          }
          $llvmDir = $config.DirectoryName
          Write-Host "Found LLVM CMake package at $llvmDir"
          cmake -S native/llvm_jit -B build/llvm-jit -G Ninja "-DLLVM_DIR=$llvmDir"
      - name: Build
        run: cmake --build build/llvm-jit --config Release
      - name: Run ORC smoke test
        run: ctest --test-dir build/llvm-jit -C Release --output-on-failure
