name: Performance Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-synthetic-sg1000:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install project
        run: python -m pip install -e .
      - name: Profile CPU, VDP, and integrated execution
        run: |
          python tools/benchmarks/profile_emulation.py --repeats 5 --profile profile.pstats | tee performance-profile.txt
      - name: Upload profiling report
        uses: actions/upload-artifact@v4
        with:
          name: sg1000-performance-profile
          path: |
            performance-profile.txt
            profile.pstats
          if-no-files-found: error
          retention-days: 14
