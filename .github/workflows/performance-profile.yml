name: Performance Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-sg1000:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install project
        run: python -m pip install -e .
      - name: Profile synthetic CPU, VDP, and integrated execution
        shell: bash
        run: |
          set -o pipefail
          python tools/benchmarks/profile_emulation.py --repeats 5 --profile profile.pstats | tee performance-profile.txt
      - name: Download and verify Super Uwol homebrew ROM
        shell: bash
        run: |
          set -euo pipefail
          ROM_PATH="$RUNNER_TEMP/super-uwol.sg"
          # SMS Power is the original release page, but its direct archive endpoint
          # returns HTTP 403 to GitHub-hosted runners. Use a public raw mirror only
          # for this transient test; never commit or upload the ROM itself.
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 90 \
            "https://raw.githubusercontent.com/webrcade/webrcade-default-feed/b7bc8e1946aa67436bb296955d55bbf3f3841ba6/content/sms/mojon-twins--super-uwol.sg" \
            --output "$ROM_PATH"
          python - "$ROM_PATH" <<'PY'
          import pathlib
          import sys
          import zlib

          rom_path = pathlib.Path(sys.argv[1])
          rom = rom_path.read_bytes()
          crc32 = zlib.crc32(rom) & 0xFFFFFFFF
          print(f"ROM file: {rom_path.name}")
          print(f"ROM size: {len(rom)} bytes")
          print(f"ROM CRC32: {crc32:08X}")
          if len(rom) != 0xC000 or crc32 != 0xAA8EA6EB:
              raise SystemExit("ROM identity check failed; expected Super Uwol SG-1000 CRC32 AA8EA6EB and size 0xC000")
          PY
          echo "ROM_PATH=$ROM_PATH" >> "$GITHUB_ENV"
          sha256sum "$ROM_PATH" | tee super-uwol-rom-sha256.txt
      - name: Benchmark Super Uwol ROM
        shell: bash
        timeout-minutes: 7
        run: |
          set -o pipefail
          python tools/benchmarks/benchmark_rom.py \
            --rom "$ROM_PATH" \
            --warmup-frames 30 \
            --frames 120 \
            --repeats 3 \
            --render-diagnostics \
            --profile super-uwol.pstats | tee super-uwol-benchmark.txt
      - name: Diagnose runtime phases and frame output
        shell: bash
        timeout-minutes: 7
        run: |
          set -o pipefail
          python tools/benchmarks/runtime_diagnostics.py \
            --rom "$ROM_PATH" \
            --warmup-frames 30 \
            --frames 120 \
            --output runtime-diagnostic.json | tee runtime-diagnostic.txt
      - name: Upload profiling reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg1000-performance-profile
          path: |
            performance-profile.txt
            profile.pstats
            super-uwol-benchmark.txt
            super-uwol.pstats
            runtime-diagnostic.txt
            runtime-diagnostic.json
            super-uwol-archive-list.txt
            super-uwol-rom-sha256.txt
          if-no-files-found: warn
          retention-days: 14
