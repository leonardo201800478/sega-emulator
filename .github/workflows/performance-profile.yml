name: Performance Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-sg1000:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install project
        run: python -m pip install -e .
      - name: Profile synthetic CPU, VDP, and integrated execution
        shell: bash
        run: |
          set -o pipefail
          python tools/benchmarks/profile_emulation.py --repeats 5 --profile profile.pstats | tee performance-profile.txt
      - name: Download Super Uwol homebrew ROM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/super-uwol"
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 90 \
            "https://www.smspower.org/uploads/Homebrew/SuperUwol-SG-201611191411.zip" \
            --output "$RUNNER_TEMP/super-uwol.zip"
          unzip -l "$RUNNER_TEMP/super-uwol.zip" | tee super-uwol-archive-list.txt
          unzip -q "$RUNNER_TEMP/super-uwol.zip" -d "$RUNNER_TEMP/super-uwol"
          ROM_PATH="$(find "$RUNNER_TEMP/super-uwol" -type f \( -iname '*.sg' -o -iname '*.bin' -o -iname '*.rom' -o -iname '*.sms' \) -print -quit)"
          if [ -z "$ROM_PATH" ]; then
            echo "ERROR: no SG-1000 ROM file found in Super Uwol archive"
            exit 1
          fi
          echo "ROM_PATH=$ROM_PATH" >> "$GITHUB_ENV"
          sha256sum "$ROM_PATH" | tee super-uwol-rom-sha256.txt
      - name: Benchmark Super Uwol ROM
        shell: bash
        timeout-minutes: 7
        run: |
          set -o pipefail
          python tools/benchmarks/benchmark_rom.py \
            --rom "$ROM_PATH" \
            --warmup-frames 30 \
            --frames 120 \
            --repeats 3 \
            --profile super-uwol.pstats | tee super-uwol-benchmark.txt
      - name: Upload profiling reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg1000-performance-profile
          path: |
            performance-profile.txt
            profile.pstats
            super-uwol-benchmark.txt
            super-uwol.pstats
            super-uwol-archive-list.txt
            super-uwol-rom-sha256.txt
          if-no-files-found: warn
          retention-days: 14
