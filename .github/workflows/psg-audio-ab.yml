name: PSG Audio A/B Reference

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "native/sn76489/**"
      - "tools/audio/**"
      - "docs/audio/modern-hifi-audio-roadmap.md"
      - ".github/workflows/psg-audio-ab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psg-audio-ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render-and-compare:
    name: Render historical and current PSG traces
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout historical audio baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f47f71830344b85f72329376505d400bfbfaae69
          path: baseline
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: Prepare identical trace source in historical baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline/native/sn76489/examples artifacts
          cp native/sn76489/examples/psg_trace.rs baseline/native/sn76489/examples/psg_trace.rs

      - name: Render SMS and SG-1000 reference WAV files
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --locked --manifest-path baseline/Cargo.toml -p sega-sn76489 --example psg_trace -- sms artifacts/baseline-sms.wav
          cargo run --release --locked --manifest-path baseline/Cargo.toml -p sega-sn76489 --example psg_trace -- sg1000 artifacts/baseline-sg1000.wav
          cargo run --release --locked -p sega-sn76489 --example psg_trace -- sms artifacts/current-sms.wav
          cargo run --release --locked -p sega-sn76489 --example psg_trace -- sg1000 artifacts/current-sg1000.wav
          cargo run --release --locked -p sega-sn76489 --example psg_trace -- sms artifacts/current-sms-chunked.wav 997
          cargo run --release --locked -p sega-sn76489 --example psg_trace -- sg1000 artifacts/current-sg1000-chunked.wav 997

      - name: Compare PCM traces and produce report
        run: |
          python tools/audio/compare_psg_wav.py \
            --baseline-sms artifacts/baseline-sms.wav \
            --current-sms artifacts/current-sms.wav \
            --chunked-sms artifacts/current-sms-chunked.wav \
            --baseline-sg1000 artifacts/baseline-sg1000.wav \
            --current-sg1000 artifacts/current-sg1000.wav \
            --chunked-sg1000 artifacts/current-sg1000-chunked.wav

      - name: Upload WAV traces and comparison report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psg-audio-ab-reference
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
