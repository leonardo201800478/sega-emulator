name: Qt Frontend Focused Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-frontend-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qt-focused:
    name: Qt, controller and frontend regression (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install system libraries required by headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - name: Install Qt frontend and development dependencies
        run: python -m pip install -e ".[dev,qt]"
      - name: Test Qt UI, ROM library and controller bridge
        run: |
          python -m pytest -q \
            tests/test_qt_preferences.py tests/test_qt_main_window.py \
            tests/test_qt_settings_dialog.py tests/test_qt_scraper_settings.py \
            tests/test_qt_box_art.py tests/test_qt_rom_library_dialog.py \
            tests/test_rom_library.py tests/test_controller_profiles.py \
            tests/test_rust_controller_input.py tests/test_native_input_runtime.py
