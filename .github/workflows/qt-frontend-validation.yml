name: Qt Frontend Rebuild Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/sega_emulator/frontend/qt/**"
      - "src/sega_emulator/frontend/qt_frontend.py"
      - "src/sega_emulator/frontend/controller_input.py"
      - "src/sega_emulator/frontend/sdl3_controller_input.py"
      - "tests/test_qt_*.py"
      - "tests/test_controller_input.py"
      - "tests/test_sdl3_controller_input.py"
      - "pyproject.toml"
      - ".github/workflows/qt-frontend-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-frontend-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qt-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install system libraries required by headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - name: Install Qt frontend and development dependencies
        run: python -m pip install -e ".[dev,qt]"
      - name: Check changed Python formatting
        run: python -m ruff format --check src/sega_emulator/frontend/qt tests/test_qt_preferences.py tests/test_qt_main_window.py tests/test_qt_audio_output.py
      - name: Lint frontend and tests
        run: python -m ruff check src/sega_emulator/frontend/qt tests/test_qt_preferences.py tests/test_qt_main_window.py tests/test_qt_audio_output.py
      - name: Test Qt preferences, window, and audio output
        run: python -m pytest -q tests/test_qt_preferences.py tests/test_qt_main_window.py tests/test_qt_audio_output.py
      - name: Test controller backends
        run: python -m pytest -q tests/test_controller_input.py tests/test_sdl3_controller_input.py
      - name: Run complete test suite
        run: python -m pytest -q
