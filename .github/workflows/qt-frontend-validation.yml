name: Qt Frontend Rebuild Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/sega_emulator/frontend/qt/**"
      - "src/sega_emulator/rom_library.py"
      - "tests/test_rom_library.py"
      - "docs/architecture/qt-multisystem-experience-roadmap.md"
      - "src/sega_emulator/machine/sg1000.py"
      - "src/sega_emulator/__main__.py"
      - "tests/test_sg1000_native_machine.py"
      - "tests/test_rust_runtime_selection.py"
      - "tests/test_vgm_machine_integration.py"
      - "src/sega_emulator/frontend/qt_frontend.py"
      - "src/sega_emulator/frontend/controller_profiles.py"
      - "src/sega_emulator/frontend/rust_controller_input.py"
      - "native/input_runtime/**"
      - "native/z80_core/src/input.rs"
      - "tests/test_rust_controller_input.py"
      - "tests/test_native_input_runtime.py"
      - "tests/test_qt_*.py"
      - "tests/test_controller_profiles.py"
      - "pyproject.toml"
      - ".github/workflows/qt-frontend-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-frontend-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qt-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install system libraries required by headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - name: Install Qt frontend and development dependencies
        run: python -m pip install -e ".[dev,qt]"
      - name: Check changed Python formatting
        run: python -m ruff format --check src/sega_emulator/frontend/rust_controller_input.py tests/test_rust_controller_input.py src/sega_emulator/frontend/qt src/sega_emulator/rom_library.py src/sega_emulator/frontend/qt/rom_library_dialog.py tests/test_qt_preferences.py tests/test_qt_main_window.py tests/test_qt_settings_dialog.py tests/test_qt_scraper_settings.py tests/test_qt_box_art.py tests/test_rom_library.py
      - name: Lint frontend and tests
        run: python -m ruff check src/sega_emulator/frontend/rust_controller_input.py tests/test_rust_controller_input.py src/sega_emulator/frontend/qt src/sega_emulator/rom_library.py tests/test_rom_library.py tests/test_qt_preferences.py tests/test_qt_main_window.py tests/test_qt_settings_dialog.py tests/test_qt_scraper_settings.py tests/test_qt_box_art.py tests/test_qt_rom_library_dialog.py
      - name: Test Qt preferences, window, and audio output
        run: python -m pytest -q tests/test_qt_preferences.py tests/test_qt_main_window.py tests/test_qt_settings_dialog.py tests/test_qt_scraper_settings.py tests/test_qt_box_art.py tests/test_rom_library.py
      - name: Test controller backends
        run: python -m pytest -q tests/test_controller_profiles.py tests/test_rust_controller_input.py
      - name: Run complete test suite
        run: python -m pytest -q
