name: Qt selectable Rust Z80 core

concurrency:
  group: qt-rust-z80-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "native/z80_core/**"
      - "native/sg1000_core/**"
      - "native/z80_alu/**"
      - "src/sega_emulator/machine/sg1000.py"
      - "src/sega_emulator/frontend/qt/**"
      - "src/sega_emulator/frontend/qt_frontend.py"
      - "tests/test_qt_*.py"
      - "tests/unit/test_vulkan_video_widget.py"
      - "tests/test_sg1000_cpu_backend.py"
      - "tests/test_sg1000_native_machine.py"
      - "tests/test_rust_runtime_selection.py"
      - "tests/test_sn76489_rust_parity.py"
      - "tests/integration/test_rust_z80_core.py"
      - ".github/workflows/qt-rust-z80-core.yml"
  push:
    branches: ["feat/qt-rust-z80-available"]
    paths:
      - "native/z80_core/**"
      - "native/z80_alu/**"
      - "src/sega_emulator/machine/sg1000.py"
      - "src/sega_emulator/frontend/qt/**"
      - "src/sega_emulator/frontend/qt_frontend.py"
      - "tests/test_qt_*.py"
      - "tests/test_sg1000_cpu_backend.py"
      - "tests/test_sg1000_native_machine.py"
      - "tests/test_rust_runtime_selection.py"
      - "tests/test_sn76489_rust_parity.py"
      - "tests/integration/test_rust_z80_core.py"
      - ".github/workflows/qt-rust-z80-core.yml"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project, Qt and Maturin
        run: python -m pip install -e ".[dev,qt]" maturin
      - name: Rust formatting
        run: cargo fmt --manifest-path native/z80_core/Cargo.toml --all -- --check
      - name: Rust Clippy
        run: cargo clippy --manifest-path native/z80_core/Cargo.toml --all-targets -- -D warnings
      - name: Rust unit tests
        run: cargo test --manifest-path native/z80_core/Cargo.toml
      - name: Build and install optional extension
        shell: pwsh
        run: |
          Push-Location native/z80_core
          maturin build --release --features python-extension --out dist
          Pop-Location
          $wheel = Get-ChildItem native/z80_core/dist/*.whl | Select-Object -First 1
          python -m pip install $wheel.FullName
      - name: Lint and format Python
        run: |
          python -m ruff check src/sega_emulator/machine/sg1000.py src/sega_emulator/frontend/qt/main_window.py src/sega_emulator/frontend/qt/preferences.py src/sega_emulator/frontend/qt/video_widget.py src/sega_emulator/frontend/qt_frontend.py tests/unit/test_vulkan_video_widget.py tests/test_qt_main_window.py tests/test_qt_preferences.py tests/test_sg1000_cpu_backend.py tests/test_sg1000_native_machine.py tests/test_rust_runtime_selection.py tests/test_sn76489_rust_parity.py tests/integration/test_rust_z80_core.py
          python -m ruff format --check src/sega_emulator/machine/sg1000.py src/sega_emulator/frontend/qt/main_window.py src/sega_emulator/frontend/qt/preferences.py src/sega_emulator/frontend/qt/video_widget.py src/sega_emulator/frontend/qt_frontend.py tests/unit/test_vulkan_video_widget.py tests/test_qt_main_window.py tests/test_qt_preferences.py tests/test_sg1000_cpu_backend.py tests/test_sg1000_native_machine.py tests/test_rust_runtime_selection.py tests/test_sn76489_rust_parity.py tests/integration/test_rust_z80_core.py
      - name: Test Qt backend selection and Rust parity
        run: python -m pytest tests/unit/test_vulkan_video_widget.py tests/test_qt_main_window.py tests/test_qt_preferences.py tests/test_sg1000_cpu_backend.py tests/test_sg1000_native_machine.py tests/test_rust_runtime_selection.py tests/test_sn76489_rust_parity.py tests/integration/test_rust_z80_core.py -q
