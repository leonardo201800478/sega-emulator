# Windows hardware/Qt integration is an opt-in diagnostic; routine Rust gates run in ci.yml.
name: Qt Rust SG-1000 runtime integration (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-rust-integration-manual
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and Qt test dependencies
        run: python -m pip install -e ".[dev,qt]"
      - name: Install official SDL3 runtime
        shell: pwsh
        run: ./scripts/install_sdl3_runtime.ps1
      - name: Run Windows Qt and native-runtime integration tests
        env:
          SEGA_INPUT_REQUIRE_SDL3: "1"
        run: |
          python -m pytest -q \
            tests/unit/test_vulkan_video_widget.py \
            tests/test_qt_main_window.py tests/test_qt_preferences.py \
            tests/test_sg1000_native_machine.py tests/test_sms_native_audio.py \
            tests/test_rust_runtime_selection.py tests/test_qt_drivers_dialog.py \
            tests/test_qt_settings_dialog.py tests/test_rust_controller_input.py \
            tests/test_native_input_runtime.py
