# This workflow validates only the optional native/z80_core extension. SG-1000 workspace slices are validated by the Rust SG-1000 Workspace workflow.
name: Qt Rust SG-1000 runtime integration

concurrency:
  group: qt-rust-z80-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "native/audio_runtime/**"
      - "native/audio_output/**"
      - "pyproject.toml"
      - "src/sega_emulator/frontend/qt/drivers_dialog.py"
      - "src/sega_emulator/frontend/qt/settings_dialog.py"
      - "tests/test_qt_drivers_dialog.py"
      - "tests/test_qt_settings_dialog.py"
      - "src/sega_emulator/frontend/qt/audio_output.py"
      - "src/sega_emulator/frontend/qt/wasapi_audio.py"
      - "tests/test_qt_audio_output.py"
      - "tests/unit/test_wasapi_audio_output.py"
      - "native/z80_core/**"
      - "native/z80_core/Cargo.toml"
      - "native/z80_core/Cargo.lock"
      - "native/sms_core/**"
      - "native/z80_bus/**"
      - "tests/test_sms_native_audio.py"
      - "native/sg1000_core/**"
      - "src/sega_emulator/machine/sg1000.py"
      - "src/sega_emulator/frontend/qt_frontend.py"
      - "tests/test_sg1000_native_machine.py"
      - "tests/test_rust_runtime_selection.py"
      - "tests/test_vgm_machine_integration.py"
  push:
    branches: ["feat/qt-rust-z80-available"]
    paths:
      - "native/z80_core/**"
      - "native/z80_core/Cargo.toml"
      - "native/z80_core/Cargo.lock"
      - "native/sg1000_core/**"
      - "src/sega_emulator/machine/sg1000.py"
      - "src/sega_emulator/frontend/qt_frontend.py"
      - "tests/test_sg1000_native_machine.py"
      - "tests/test_rust_runtime_selection.py"
      - "tests/test_vgm_machine_integration.py"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project, Qt and Maturin
        run: python -m pip install -e ".[dev,qt]" maturin
      - name: Generate native dependency lockfiles for review
        run: |
          cargo generate-lockfile --manifest-path native/z80_core/Cargo.toml
          cargo generate-lockfile --manifest-path native/audio_output/Cargo.toml
      - name: Rust formatting
        run: cargo fmt --manifest-path native/z80_core/Cargo.toml --all -- --check
      - name: Rust formatting — native audio output
        run: cargo fmt --manifest-path native/audio_output/Cargo.toml -- --check
      - name: Rust Clippy — native audio output
        run: cargo clippy --manifest-path native/audio_output/Cargo.toml --locked --all-targets -- -D warnings
      - name: Rust tests — native audio output
        run: cargo test --manifest-path native/audio_output/Cargo.toml --locked
      - name: Rust Clippy
        run: cargo clippy --manifest-path native/z80_core/Cargo.toml --locked --all-targets -- -D warnings
      - name: Rust unit tests
        run: cargo test --manifest-path native/z80_core/Cargo.toml --locked
      - name: Build and install optional extension
        shell: pwsh
        run: |
          Push-Location native/z80_core
          maturin build --locked --release --features python-extension --out dist
          Pop-Location
          $wheel = Get-ChildItem native/z80_core/dist/*.whl | Select-Object -First 1
          python -m pip install $wheel.FullName
      - name: Archive generated native dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: native-audio-cargo-lock
          path: |
            native/z80_core/Cargo.lock
            native/audio_output/Cargo.lock
          if-no-files-found: error
      - name: Lint and format Python
        run: |
          python -m ruff check src/sega_emulator/machine/sg1000.py src/sega_emulator/__main__.py src/sega_emulator/frontend/qt/main_window.py src/sega_emulator/frontend/qt/preferences.py src/sega_emulator/frontend/qt/video_widget.py src/sega_emulator/frontend/qt/settings_dialog.py src/sega_emulator/frontend/qt_frontend.py src/sega_emulator/frontend/qt/audio_output.py src/sega_emulator/frontend/qt/wasapi_audio.py src/sega_emulator/frontend/qt/drivers_dialog.py tests/test_qt_audio_output.py tests/unit/test_wasapi_audio_output.py tests/test_qt_drivers_dialog.py tests/test_qt_settings_dialog.py tests/unit/test_vulkan_video_widget.py tests/test_qt_main_window.py tests/test_qt_preferences.py tests/test_sg1000_native_machine.py tests/test_sms_native_audio.py tests/test_rust_runtime_selection.py tests/test_vgm_machine_integration.py
          python -m ruff format --check src/sega_emulator/machine/sg1000.py src/sega_emulator/__main__.py src/sega_emulator/frontend/qt/main_window.py src/sega_emulator/frontend/qt/preferences.py src/sega_emulator/frontend/qt/video_widget.py src/sega_emulator/frontend/qt/settings_dialog.py src/sega_emulator/frontend/qt_frontend.py src/sega_emulator/frontend/qt/audio_output.py src/sega_emulator/frontend/qt/wasapi_audio.py src/sega_emulator/frontend/qt/drivers_dialog.py tests/test_qt_audio_output.py tests/unit/test_wasapi_audio_output.py tests/unit/test_vulkan_video_widget.py tests/test_qt_main_window.py tests/test_qt_preferences.py tests/test_sg1000_native_machine.py tests/test_sms_native_audio.py tests/test_rust_runtime_selection.py tests/test_vgm_machine_integration.py
      - name: Test Qt integration and Rust-only runtime
        run: python -m pytest tests/unit/test_vulkan_video_widget.py tests/test_qt_main_window.py tests/test_qt_preferences.py tests/test_sg1000_native_machine.py tests/test_sms_native_audio.py tests/test_rust_runtime_selection.py tests/test_qt_audio_output.py tests/unit/test_wasapi_audio_output.py tests/test_qt_drivers_dialog.py tests/test_qt_settings_dialog.py -q
