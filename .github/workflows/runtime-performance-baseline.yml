name: Runtime Performance Baseline

on:
  pull_request:
    paths:
      - "src/sega_emulator/**"
      - "tools/benchmarks/runtime_benchmark.py"
      - ".github/workflows/runtime-performance-baseline.yml"
      - "pyproject.toml"
  push:
    branches:
      - "perf/runtime-benchmark-baseline"
    paths:
      - "src/sega_emulator/**"
      - "tools/benchmarks/runtime_benchmark.py"
      - ".github/workflows/runtime-performance-baseline.yml"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      frames:
        description: "Measured frames per trial (synthetic workload)"
        required: true
        default: "120"
        type: string
      trials:
        description: "Number of trials per execution path"
        required: true
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: runtime-performance-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Check benchmark style
        run: |
          python -m ruff check tools/benchmarks/runtime_benchmark.py
          python -m ruff format --check tools/benchmarks/runtime_benchmark.py

      - name: Run deterministic benchmark smoke test
        run: |
          python tools/benchmarks/runtime_benchmark.py \
            --frames "${{ inputs.frames || '30' }}" \
            --warmup-frames 5 \
            --trials "${{ inputs.trials || '3' }}" \
            --output artifacts/runtime-benchmark.json

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-benchmark-${{ github.run_id }}
          path: artifacts/runtime-benchmark.json
          if-no-files-found: warn
          retention-days: 30
