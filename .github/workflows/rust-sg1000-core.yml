name: Rust SG-1000 Workspace

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "native/sg1000_core/**"
      - "native/z80_alu/**"
      - "native/z80_bus/**"
      - ".github/workflows/rust-sg1000-core.yml"
  push:
    branches:
      - "main"
      - "feat/rust-standalone-sg1000-test"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "native/sg1000_core/**"
      - "native/z80_alu/**"
      - ".github/workflows/rust-sg1000-core.yml"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --locked
