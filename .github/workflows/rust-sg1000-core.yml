name: Standalone Rust SG-1000 Core

on:
  pull_request:
    paths:
      - "native/sg1000_core/**"
      - "native/z80_alu/**"
      - ".github/workflows/rust-sg1000-core.yml"
  push:
    branches:
      - "feat/rust-standalone-sg1000-test"
    paths:
      - "native/sg1000_core/**"
      - "native/z80_alu/**"
      - ".github/workflows/rust-sg1000-core.yml"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo fmt --manifest-path native/sg1000_core/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path native/sg1000_core/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path native/sg1000_core/Cargo.toml
