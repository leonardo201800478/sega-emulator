name: Rust Z80 ALU Differential Prototype

on:
  pull_request:
    paths:
      - "native/z80_alu/**"
      - "src/sega_emulator/cpu/z80.py"
      - "tests/integration/test_z80_alu_rust_parity.py"
      - ".github/workflows/rust-z80-alu.yml"
  push:
    branches: ["rust/z80-alu-differential-prototype"]
    paths:
      - "native/z80_alu/**"
      - "src/sega_emulator/cpu/z80.py"
      - "tests/integration/test_z80_alu_rust_parity.py"
      - ".github/workflows/rust-z80-alu.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Python test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check Rust formatting
        run: cargo fmt --manifest-path native/z80_alu/Cargo.toml --all -- --check
      - name: Run Clippy
        run: cargo clippy --manifest-path native/z80_alu/Cargo.toml --all-targets -- -D warnings
      - name: Run Rust unit tests
        run: cargo test --manifest-path native/z80_alu/Cargo.toml
      - name: Differentially compare all ADD/SUB operand pairs
        run: python -m pytest tests/integration/test_z80_alu_rust_parity.py -q