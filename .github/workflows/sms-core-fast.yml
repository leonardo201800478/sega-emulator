name: SMS Core Fast Validation

on:
  pull_request:
    paths:
      - "native/sms_core/**"
      - "native/z80_bus/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/sms-core-fast.yml"
  push:
    branches: [main]
    paths:
      - "native/sms_core/**"
      - "native/z80_bus/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/sms-core-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sms-core-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sms-core:
    name: SMS focused format, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format workspace (fast)
        run: cargo fmt --all -- --check
      - name: Lint SMS core only
        run: cargo clippy -p sega-sms-core --all-targets --locked -- -D warnings
      - name: Test SMS core only
        run: cargo test -p sega-sms-core --locked
