name: SMS Debugger Runtime

on:
  pull_request:
    paths:
      - "native/sms_core/**"
      - "native/z80_cpu/**"
      - "native/z80_alu/**"
      - "native/z80_bus/**"
      - "native/temporal_core/**"
      - "native/machine_scheduler/**"
      - "native/sn76489/**"
      - "native/audio_runtime/**"
      - "native/video_core/**"
      - "native/observability/**"
      - "rust/runtime/sms-runtime/**"
      - "tests/sms/**"
      - ".github/workflows/sms-debugger-runtime.yml"
  push:
    branches: [main]
    paths:
      - "native/sms_core/**"
      - "native/z80_cpu/**"
      - "native/z80_alu/**"
      - "native/z80_bus/**"
      - "native/temporal_core/**"
      - "native/machine_scheduler/**"
      - "native/sn76489/**"
      - "native/audio_runtime/**"
      - "native/video_core/**"
      - "native/observability/**"
      - "rust/runtime/sms-runtime/**"
      - ".github/workflows/sms-debugger-runtime.yml"

permissions:
  contents: read

concurrency:
  group: sms-runtime-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sms-runtime-release:
    name: SMS runtime Release format, Clippy and tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1

      - name: Check root workspace formatting
        run: cargo fmt --all -- --check

      - name: Clippy SMS runtime (Release)
        run: cargo clippy --release --manifest-path rust/runtime/sms-runtime/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test SMS runtime (Release)
        run: cargo test --release --manifest-path rust/runtime/sms-runtime/Cargo.toml --all-targets --locked

      - name: Build SMS runtime (Release, Windows x64)
        run: cargo build --release --manifest-path rust/runtime/sms-runtime/Cargo.toml --locked --target x86_64-pc-windows-msvc

  smsmemtest-rom-diagnostic:
    name: SMSmemtest pinned ROM build and diagnostic (non-gating result)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SMSMEMTEST_REVISION: 12771ed247b93d3a83d0c3cbe7d2d39e3ccb47d9
      DEVKIT_SMS_REVISION: 561bc2cb9829cdf2e31ad8cd43835037c8c44a63
      SMSMEMTEST_ROOT: ${{ runner.temp }}/SMSmemtest
      DEVKIT_SMS_ROOT: ${{ runner.temp }}/devkitSMS
      OUT_DIR: ${{ runner.temp }}/smsmemtest-output
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned SDCC 4.6.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sdcc-4.6.0.tar.bz2"
          curl --fail --location --retry 3 \
            "https://downloads.sourceforge.net/project/sdcc/sdcc-linux-amd64/4.6.0/sdcc-4.6.0-amd64-unknown-linux2.5.tar.bz2" \
            --output "$archive"
          mkdir -p "$RUNNER_TEMP/sdcc"
          tar -xjf "$archive" -C "$RUNNER_TEMP/sdcc"
          sdcc_bin="$(find "$RUNNER_TEMP/sdcc" -type f -path '*/bin/sdcc' -print -quit)"
          if [[ -z "$sdcc_bin" ]]; then
            echo "SDCC binary was not found in the official 4.6.0 archive" >&2
            exit 1
          fi
          echo "SDCC_BIN=$sdcc_bin" >> "$GITHUB_ENV"
          echo "$(dirname "$sdcc_bin")" >> "$GITHUB_PATH"
          "$sdcc_bin" --version

      - name: Checkout immutable upstream sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/sverx/SMSmemtest.git "$SMSMEMTEST_ROOT"
          git -C "$SMSMEMTEST_ROOT" fetch --depth 1 origin "$SMSMEMTEST_REVISION"
          git -C "$SMSMEMTEST_ROOT" checkout --detach "$SMSMEMTEST_REVISION"

          git clone --filter=blob:none --no-checkout https://github.com/sverx/devkitSMS.git "$DEVKIT_SMS_ROOT"
          git -C "$DEVKIT_SMS_ROOT" fetch --depth 1 origin "$DEVKIT_SMS_REVISION"
          git -C "$DEVKIT_SMS_ROOT" checkout --detach "$DEVKIT_SMS_REVISION"

      - name: Build SMSmemtest ROM from pinned source
        shell: bash
        run: bash tests/sms/scripts/build_smsmemtest.sh

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: Run bounded full-machine diagnostic (non-gating ROM result)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rom="$OUT_DIR/SMSmemtest.sms"
          rom_sha256="$(awk -F= '$1 == "rom_sha256" { print $2 }' "$OUT_DIR/SMSmemtest.build-info.txt")"
          set +e
          cargo run --release --locked -p sega-sms-core --example sms_rom_runner -- \
            --rom "$rom" \
            --rom-sha256 "$rom_sha256" \
            --emulator-sha "$GITHUB_SHA" \
            --suite-id smsmemtest \
            --suite-revision "$SMSMEMTEST_REVISION" \
            --region usa \
            --frames 1800 \
            --max-instructions-per-frame 100000 \
            > "$OUT_DIR/smsmemtest-run.jsonl" \
            2> "$OUT_DIR/smsmemtest-run.stderr"
          runner_exit_code=$?
          set -e
          printf '%s\n' "$runner_exit_code" > "$OUT_DIR/runner-exit-code.txt"
          python3 - "$OUT_DIR/smsmemtest-run.jsonl" "$OUT_DIR/runner-exit-code.txt" <<'PY'
          import json
          import pathlib
          import sys

          log_path = pathlib.Path(sys.argv[1])
          exit_code = pathlib.Path(sys.argv[2]).read_text().strip()
          records = []
          for line in log_path.read_text(errors="replace").splitlines():
              try:
                  record = json.loads(line)
              except json.JSONDecodeError:
                  continue
              records.append(record)

          for record in records:
              if record.get("record") in {"smsmemtest_input", "smsmemtest_case", "summary"}:
                  print(json.dumps(record, sort_keys=True))

          summaries = [item for item in records if item.get("record") == "summary"]
          print(f"runner_exit_code={exit_code}")
          if not summaries:
              print("diagnostic_status=NO_SUMMARY_RECORD")
          else:
              print(f"diagnostic_status={summaries[-1].get('status', 'UNKNOWN')}")
          PY

      - name: Publish ROM and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sms-memtest-diagnostic-evidence
          path: |
            ${{ runner.temp }}/smsmemtest-output/SMSmemtest.sms
            ${{ runner.temp }}/smsmemtest-output/SMSmemtest.build-info.txt
            ${{ runner.temp }}/smsmemtest-output/smsmemtest-run.jsonl
            ${{ runner.temp }}/smsmemtest-output/smsmemtest-run.stderr
            ${{ runner.temp }}/smsmemtest-output/runner-exit-code.txt
          if-no-files-found: warn
          retention-days: 14

  sms-debugger-release:
    # Compatibility with the protected legacy check context. The egui debugger
    # host is intentionally NOT RUN; debugger_core remains covered by workspace CI.
    name: SMS debugger Windows Release validation
    if: github.event_name == 'workflow_dispatch' && github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Legacy host intentionally not run
        run: |
          echo "NOT RUN: legacy egui debugger host is outside the supported CI baseline."
