name: SMS Debugger Runtime

on:
  pull_request:
    paths:
      - "native/debugger_core/**"
      - "native/sms_debugger/**"
      - "native/sms_core/**"
      - "native/z80_cpu/**"
      - "native/z80_alu/**"
      - "native/z80_bus/**"
      - "native/temporal_core/**"
      - "native/machine_scheduler/**"
      - "native/sn76489/**"
      - "native/audio_runtime/**"
      - "native/video_core/**"
      - "native/observability/**"
      - "rust/runtime/sms-runtime/**"
      - ".github/workflows/sms-debugger-runtime.yml"
  push:
    branches: [main]
    paths:
      - "native/debugger_core/**"
      - "native/sms_debugger/**"
      - "native/sms_core/**"
      - "native/z80_cpu/**"
      - "native/z80_alu/**"
      - "native/z80_bus/**"
      - "native/temporal_core/**"
      - "native/machine_scheduler/**"
      - "native/sn76489/**"
      - "native/audio_runtime/**"
      - "native/video_core/**"
      - "native/observability/**"
      - "rust/runtime/sms-runtime/**"
      - ".github/workflows/sms-debugger-runtime.yml"

permissions:
  contents: read

concurrency:
  group: sms-debugger-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sms-runtime-release:
    name: SMS runtime Release format, Clippy and tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1

      - name: Check root workspace formatting
        run: cargo fmt --all -- --check

      - name: Clippy SMS runtime (Release)
        run: cargo clippy --release --manifest-path rust/runtime/sms-runtime/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test SMS runtime (Release)
        run: cargo test --release --manifest-path rust/runtime/sms-runtime/Cargo.toml --all-targets --locked

  sms-debugger-release:
    name: SMS debugger Windows x64 Release validation
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1

      - name: Validate standalone debugger manifest and lockfile
        shell: pwsh
        run: |
          cargo metadata --locked --no-deps --format-version 1 --manifest-path native/sms_debugger/Cargo.toml
          if (-not (Test-Path native/sms_debugger/Cargo.lock -PathType Leaf)) {
            throw "The standalone SMS debugger Cargo.lock must be versioned."
          }

      - name: Check debugger formatting
        run: cargo fmt --manifest-path native/sms_debugger/Cargo.toml --all -- --check

      - name: Clippy SMS debugger (Release)
        run: cargo clippy --release --manifest-path native/sms_debugger/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test SMS debugger (Release)
        run: cargo test --release --manifest-path native/sms_debugger/Cargo.toml --all-targets --locked

      - name: Build SMS debugger (Release)
        run: cargo build --release --manifest-path native/sms_debugger/Cargo.toml --locked --target x86_64-pc-windows-msvc
