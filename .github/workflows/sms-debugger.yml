name: SMS Debugger

on:
  pull_request:
    paths:
      - "native/debugger_core/**"
      - "native/sms_debugger/**"
      - "native/sms_core/**"
      - "native/z80_cpu/**"
      - ".github/workflows/sms-debugger.yml"
  push:
    branches: [main]
    paths:
      - "native/debugger_core/**"
      - "native/sms_debugger/**"
      - "native/sms_core/**"
      - "native/z80_cpu/**"
      - ".github/workflows/sms-debugger.yml"

permissions:
  contents: write

concurrency:
  group: sms-debugger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-debugger:
    name: Windows SMS debugger format, Clippy and tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1

      - name: Generate standalone debugger lockfile
        run: cargo generate-lockfile --manifest-path native/sms_debugger/Cargo.toml

      - name: Format standalone debugger workspace
        run: cargo fmt --manifest-path native/sms_debugger/Cargo.toml --all -- --check

      - name: Clippy standalone debugger workspace
        run: cargo clippy --manifest-path native/sms_debugger/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test standalone debugger workspace
        run: cargo test --manifest-path native/sms_debugger/Cargo.toml --all-targets --locked


      - name: Commit generated debugger lockfile to the pull request branch
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/sms_debugger/Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "build(debugger): pin standalone workspace dependencies"
            git push origin "HEAD:$env:HEAD_REF"
          }
