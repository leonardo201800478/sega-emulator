name: SMS P0 pacing ROM runtime

on:
  pull_request:
    branches:
      - test/sms-external-rom-catalog-20261113
    paths:
      - "tests/sms/pacing-rom/**"
      - "native/sms_core/examples/sms_rom_runner.rs"
      - "native/sms_core/examples/sms_rom_runner/**"
      - "tests/sms/scripts/run_rom.py"
      - ".github/workflows/sms-pacing-rom-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sms-pacing-rom-runtime:
    name: Full-machine pacing ROM execution (four profiles)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1

      - name: Install pinned SDCC 4.6.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sdcc-4.6.0.tar.bz2"
          curl --fail --location --connect-timeout 20 --max-time 180 \
            --retry 2 --retry-all-errors --retry-max-time 240 \
            "https://downloads.sourceforge.net/project/sdcc/sdcc-linux-amd64/4.6.0/sdcc-4.6.0-amd64-unknown-linux2.5.tar.bz2" \
            --output "$archive"
          mkdir -p "$RUNNER_TEMP/sdcc"
          tar -xjf "$archive" -C "$RUNNER_TEMP/sdcc"
          sdcc_bin="$(find "$RUNNER_TEMP/sdcc" -type f -path '*/bin/sdcc' -print -quit)"
          test -n "$sdcc_bin"
          "$sdcc_bin" --version
          echo "SDCC_BIN=$sdcc_bin" >> "$GITHUB_ENV"

      - name: Checkout pinned devkitSMS
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/sverx/devkitSMS.git "$RUNNER_TEMP/devkitSMS"
          git -C "$RUNNER_TEMP/devkitSMS" fetch --depth 1 origin 561bc2cb9829cdf2e31ad8cd43835037c8c44a63
          git -C "$RUNNER_TEMP/devkitSMS" checkout --detach 561bc2cb9829cdf2e31ad8cd43835037c8c44a63
          echo "DEVKIT_SMS_ROOT=$RUNNER_TEMP/devkitSMS" >> "$GITHUB_ENV"
          echo "OUT_DIR=$RUNNER_TEMP/sms-pacing-rom-output" >> "$GITHUB_ENV"

      - name: Validate Python harness syntax
        run: python -m py_compile tests/sms/pacing-rom/run_profiles.py tests/sms/scripts/run_rom.py

      - name: Build all four deterministic pacing ROMs
        run: bash tests/sms/pacing-rom/build.sh

      - name: Execute each ROM twice through SmsTemporalMachine
        run: |
          python tests/sms/pacing-rom/run_profiles.py \
            --rom-dir "$OUT_DIR" \
            --report-dir "$RUNNER_TEMP/sms-pacing-rom-reports" \
            --frames 600 \
            --max-instructions-per-frame 100000

      - name: Upload ROMs, provenance and full-machine JSONL reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sms-p0-pacing-rom-runtime-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sms-pacing-rom-output/*.sms
            ${{ runner.temp }}/sms-pacing-rom-output/*.build-info.txt
            ${{ runner.temp }}/sms-pacing-rom-reports/*.jsonl
            ${{ runner.temp }}/sms-pacing-rom-reports/*.stderr.log
          if-no-files-found: error
          retention-days: 14
