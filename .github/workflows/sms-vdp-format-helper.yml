name: Temporary SMS VDP formatter artifact

on:
  push:
    branches: ["feature/sms-vdp-mode4"]
    paths:
      - "native/sms_core/src/**"
      - ".github/workflows/sms-vdp-format-helper.yml"
  pull_request:
    paths:
      - "native/sms_core/src/**"
      - ".github/workflows/sms-vdp-format-helper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust workspace
        run: cargo fmt --all
      - uses: actions/upload-artifact@v4
        with:
          name: sms-core-formatted-source
          path: native/sms_core/src/
          if-no-files-found: error
