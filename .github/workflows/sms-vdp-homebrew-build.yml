name: SMS VDP homebrew build verification

on:
  push:
    branches:
      - "ci/verify-sms-vdp-rom-build-20261113"
  pull_request:
    paths:
      - ".github/workflows/sms-vdp-homebrew-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sms-vdp-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout SmsVdpTest source at pinned revision
        uses: actions/checkout@v4
        with:
          repository: FluBBaOfWard/SmsVdpTest
          ref: 490c00b38c83012dee5a7a582097f080c210a3e7
          path: .build/SmsVdpTest

      - name: Checkout WLA-DX v10.7 at pinned commit
        uses: actions/checkout@v4
        with:
          repository: vhelin/wla-dx
          ref: 91c52b1f4ef3cc8ba3c0638f7536539579af6a9f
          path: .build/wla-dx

      - name: Build WLA-DX
        run: |
          cmake -S .build/wla-dx -B .build/wla-dx/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/wla-dx"
          cmake --build .build/wla-dx/build --config Release --parallel 2
          cmake --install .build/wla-dx/build
          "$RUNNER_TEMP/wla-dx/bin/wla-z80" -h
          "$RUNNER_TEMP/wla-dx/bin/wlalink" -h

      - name: Assemble and link SmsVdpTest
        working-directory: .build/SmsVdpTest
        run: |
          set -euxo pipefail
          "$RUNNER_TEMP/wla-dx/bin/wla-z80" -o object.o testmain.asm
          printf '[objects]\nobject.o\n' > linkfile
          "$RUNNER_TEMP/wla-dx/bin/wlalink" -d -r -v linkfile output.sms
          test -s output.sms
          python3 - <<'PY'
          from pathlib import Path
          rom = Path("output.sms").read_bytes()
          assert len(rom) % 16384 == 0, f"ROM size is not a 16 KiB multiple: {len(rom)}"
          print(f"SmsVdpTest ROM generated: {len(rom)} bytes ({len(rom)//16384} banks)")
          PY
          sha256sum output.sms

  build-sms-test-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout SMS Test Suite source at pinned revision
        uses: actions/checkout@v4
        with:
          repository: sverx/SMSTestSuite
          ref: 985bc04fef6f3dc3c3450fbc84242676f241d316
          path: .build/SMSTestSuite

      - name: Checkout devkitSMS toolchain and libraries at pinned commit
        uses: actions/checkout@v4
        with:
          repository: sverx/devkitSMS
          ref: 561bc2cb9829cdf2e31ad8cd43835037c8c44a63
          path: .build/devkitSMS

      - name: Checkout Banjo sound driver at pinned commit
        uses: actions/checkout@v4
        with:
          repository: joffb/banjo
          ref: 7aaf837ebbe67e567e019b5819b5467bf62253ad
          path: .build/banjo

      - name: Install SDCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes sdcc make python3
          sdcc --version
          sdar --version

      - name: Prepare legacy project layout
        run: |
          set -euxo pipefail
          cp -a .build/devkitSMS/SMSlib .build/SMSlib
          cp -a .build/devkitSMS/PSGlib .build/PSGlib
          cp -a .build/devkitSMS/crt0 .build/crt0
          cp .build/devkitSMS/SMSlib/src/peep-rules.txt .build/SMSlib/peep-rules.txt
          cp .build/devkitSMS/SMSlib/src/SMSlib.h .build/SMSlib/SMSlib.h
          cp .build/devkitSMS/PSGlib/src/PSGlib.h .build/PSGlib/PSGlib.h
          mkdir -p .build/banjo_lib_minimal
          cp .build/banjo/music_driver_sdas/banjo.h .build/banjo_lib_minimal/banjo.h
          cp .build/banjo/lib/devkitsms/*.rel .build/banjo_lib_minimal/
          test -f .build/SMSTestSuite/sn_opll_loop.rel
          test -f .build/banjo_lib_minimal/banjo.rel
          test -f .build/banjo_lib_minimal/banjo_opll.rel
          test -f .build/banjo_lib_minimal/banjo_sn.rel

      - name: Build SMSlib with the suite-required hardware features
        run: |
          set -euxo pipefail
          make -C .build/SMSlib/src CONFIG="-DMD_PAD_SUPPORT -DVDPTYPE_DETECTION" SMSlib.lib
          cp .build/SMSlib/src/SMSlib.lib .build/SMSlib/SMSlib_MD_VDP.lib
          test -s .build/SMSlib/SMSlib_MD_VDP.lib

      - name: Build PSGlib
        run: |
          set -euxo pipefail
          make -C .build/PSGlib/src PSGlib.lib
          cp .build/PSGlib/src/PSGlib.lib .build/PSGlib/PSGlib.lib
          test -s .build/PSGlib/PSGlib.lib

      - name: Generate asset bank and compile C sources
        working-directory: .build/SMSTestSuite
        run: |
          set -euxo pipefail
          python3 ../devkitSMS/tools/assets2banks/src/assets2banks.py assets --firstbank=2 --singleheader=bank1.h
          test -s bank1.h
          test -s bank2.c
          test -s bank3.c
          sdcc -c -mz80 --peep-file ../SMSlib/peep-rules.txt -o main.rel main.c
          sdcc -c -mz80 --constseg BANK2 -o bank2.rel bank2.c
          sdcc -c -mz80 --constseg BANK3 -o bank3.rel bank3.c
          test -s main.rel
          test -s bank2.rel
          test -s bank3.rel

      - name: Link and convert SMS Test Suite with the upstream-compatible IHX converter
        working-directory: .build/SMSTestSuite
        run: |
          set -euxo pipefail
          sdcc -o output.ihx -mz80 --data-loc 0xC000 --no-std-crt0 -Wl-b_BANK2=0x28000 -Wl-b_BANK3=0x38000 -L ../SMSlib ../crt0/crt0_sms.rel main.rel SMSlib_MD_VDP.lib ../PSGlib/PSGlib.lib ../banjo_lib_minimal/banjo.rel ../banjo_lib_minimal/banjo_opll.rel ../banjo_lib_minimal/banjo_sn.rel sn_opll_loop.rel bank2.rel bank3.rel
          test -s output.ihx
          chmod +x ../devkitSMS/tools/legacy/ihx2sms/Linux/ihx2sms
          SOURCE_DATE_EPOCH=1767225600 ../devkitSMS/tools/legacy/ihx2sms/Linux/ihx2sms -m output.map output.ihx output.sms
          test -s output.sms
          python3 - <<'PY'
          from pathlib import Path
          rom = Path("output.sms").read_bytes()
          assert len(rom) % 16384 == 0, f"ROM size is not a 16 KiB multiple: {len(rom)}"
          signature = rom[0x7FF0:0x7FF8]
          print(f"SMS Test Suite ROM generated: {len(rom)} bytes ({len(rom)//16384} banks)")
          print(f"SEGA header at ROM offset 0x7FF0: {signature!r}")
          if signature != b"TMR SEGA":
              print("IHX records near the expected header address:")
              for line in Path("output.ihx").read_text().splitlines():
                  if line.startswith(":") and len(line) >= 9:
                      address = int(line[3:7], 16)
                      count = int(line[1:3], 16)
                      if address < 0x8000 and address + count >= 0x7FE0:
                          print(line)
              print("Linker map entries:")
              for line in Path("output.map").read_text(errors="replace").splitlines():
                  if any(token in line for token in ("BANK2", "BANK3", "SEGA_signature", "_CODE")):
                      print(line)
              raise SystemExit("ROM has no SEGA signature; build is not accepted as bootable")
          PY
          sha256sum output.sms
