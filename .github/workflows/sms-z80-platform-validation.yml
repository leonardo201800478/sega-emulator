name: SMS Z80 External Conformance

on:
  pull_request:
    branches: [main]
    paths:
      - "native/sg1000_core/src/cpu.rs"
      - "native/z80_alu/**"
      - "native/z80_bus/**"
      - "native/sms_core/**"
      - "docs/architecture/z80-sms-platform-model.md"
      - "tools/z80test/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/sms-z80-platform-validation.yml"
  push:
    branches: [main]
    paths:
      - "native/sg1000_core/src/cpu.rs"
      - "native/z80_alu/**"
      - "native/z80_bus/**"
      - "native/sms_core/**"
      - "docs/architecture/z80-sms-platform-model.md"
      - "tools/z80test/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/sms-z80-platform-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sms-z80-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  external-conformance:
    name: Pinned upstream Z80 conformance suites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install upstream test build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++
      - name: Run Z80 full conformance suite
        run: python3 tools/z80test/run_sms_z80test.py --variant z80full --max-steps 250000000
      - name: Run Z80 SCF/CCF flag conformance suite
        run: python3 tools/z80test/run_sms_z80test.py --variant z80ccf --max-steps 250000000
