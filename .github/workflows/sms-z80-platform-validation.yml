name: SMS Z80 External Conformance (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sms-z80-conformance-manual
  cancel-in-progress: true

jobs:
  external-conformance:
    name: Pinned upstream Z80 conformance suites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install upstream test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++
      - name: Run Z80 full conformance suite
        run: python3 tools/z80test/run_sms_z80test.py --variant z80full --max-steps 250000000
      - name: Run Z80 SCF/CCF flag conformance suite
        run: python3 tools/z80test/run_sms_z80test.py --variant z80ccf --max-steps 250000000
