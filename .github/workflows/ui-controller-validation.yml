name: UI and Controller Input Validation

on:
  pull_request:
    paths:
      - "src/sega_emulator/frontend/controller_input.py"
      - "src/sega_emulator/frontend/qt_frontend.py"
      - "tests/test_controller_input.py"
      - "tests/test_qt_key_mapping.py"
      - ".github/workflows/ui-controller-validation.yml"
  push:
    branches: ["feat/modern-ui-gamepad-mapping"]
    paths:
      - "src/sega_emulator/frontend/controller_input.py"
      - "src/sega_emulator/frontend/qt_frontend.py"
      - "tests/test_controller_input.py"
      - "tests/test_qt_key_mapping.py"
      - ".github/workflows/ui-controller-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test tools
        run: python -m pip install --upgrade pip
      - name: Install project development and Qt dependencies
        run: python -m pip install -e ".[dev,qt]"
      - name: Check changed Python files with Ruff
        run: python -m ruff check src/sega_emulator/frontend/controller_input.py src/sega_emulator/frontend/qt_frontend.py tests/test_controller_input.py
      - name: Check changed Python file formatting
        run: python -m ruff format --check src/sega_emulator/frontend/controller_input.py src/sega_emulator/frontend/qt_frontend.py tests/test_controller_input.py
      - name: Compile frontend modules
        run: python -m compileall -q src/sega_emulator/frontend
      - name: Run controller and Qt key mapping tests
        run: python -m pytest tests/test_controller_input.py tests/test_qt_key_mapping.py -q
