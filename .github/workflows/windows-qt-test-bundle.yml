name: Windows Qt Test Bundle

on:
  pull_request:
    branches: [main]
    paths:
      - "src/sega_emulator/**"
      - "native/**"
      - "tests/test_qt_*.py"
      - "tests/test_rom_library.py"
      - "scripts/**"
      - "pyproject.toml"
      - "Cargo.toml"
      - ".github/workflows/windows-qt-test-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-qt-test-bundle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      SDL_AUDIODRIVER: dummy
      PYTHONUTF8: "1"
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.14 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install application and Qt dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "Falha ao atualizar pip." }
          python -m pip install -e ".[dev,qt]"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar dependências Python/Qt." }

      - name: Build and install Rust/PyO3 runtime in Release
        shell: pwsh
        run: |
          python -m pip install "maturin>=1.9,<2"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar Maturin." }
          $wheelDir = Join-Path $env:RUNNER_TEMP "sega-wheels"
          New-Item -ItemType Directory -Force -Path $wheelDir | Out-Null
          Push-Location "native/z80_core"
          try {
            maturin build --release --features python-extension --out $wheelDir
            if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar a extensão Rust/PyO3." }
          }
          finally {
            Pop-Location
          }
          $wheel = Get-ChildItem -Path $wheelDir -Filter "*.whl" | Select-Object -First 1
          if ($null -eq $wheel) { throw "Maturin não gerou o wheel da extensão nativa." }
          python -m pip install $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar o wheel da extensão nativa." }

      - name: Verify native runtime and CLI
        shell: pwsh
        run: |
          python -c "from sega_z80_core import NativeSG1000Machine; print('NativeSG1000Machine import OK')"
          if ($LASTEXITCODE -ne 0) { throw "A extensão nativa não pode ser importada." }
          python -m sega_emulator --help
          if ($LASTEXITCODE -ne 0) { throw "A CLI não iniciou corretamente." }

      - name: Run Qt and ROM library tests
        shell: pwsh
        run: |
          python -m pytest -q tests/test_qt_main_window.py tests/test_qt_scraper_settings.py tests/test_rom_library.py
          if ($LASTEXITCODE -ne 0) { throw "Os testes direcionados do frontend falharam." }

      - name: Create source test bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          git archive --format=zip --output=dist/sega-emulator-windows-test-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw "Falha ao empacotar o código-fonte de teste." }
          @"
          Sega Emulator — Windows test bundle
          Candidate commit: ${{ github.event.pull_request.head.sha || github.sha }}

          This is a source bundle, not a standalone EXE.
          Requirements: Windows x64, Python 3.14 x64, Rust stable with MSVC build tools.

          From the extracted repository folder, run:
            powershell -ExecutionPolicy Bypass -File .\scripts\prepare-windows-test.ps1

          The script creates .venv, installs Qt dependencies, compiles the Rust/PyO3
          SG-1000 runtime in Release, verifies the native import, and opens the Qt UI.
          No commercial ROM or BIOS is included.
          "@ | Set-Content -Encoding utf8 dist/LEIA-ME-WINDOWS.txt

      - name: Upload Windows test bundle
        uses: actions/upload-artifact@v4
        with:
          name: sega-emulator-windows-test-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/sega-emulator-windows-test-source.zip
            dist/LEIA-ME-WINDOWS.txt
          if-no-files-found: error
          retention-days: 14
