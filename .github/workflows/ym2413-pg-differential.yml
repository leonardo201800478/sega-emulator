name: YM2413 Nuked PG differential

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "native/ym2413/**"
      - "tools/ym2413-nuked-oracle/compare_pg.py"
      - "tools/ym2413-nuked-oracle/compare_pg_serial.py"
      - "tools/ym2413-nuked-oracle/compare_operator.py"
      - "tools/ym2413-nuked-oracle/compare_am_lfo.py"
      - "tools/ym2413-nuked-oracle/compare_fm3_integrated.py"
      - "tools/ym2413-nuked-oracle/compare_preset_latches.py"
      - "native/ym2413/examples/serial_operator_trace.rs"
      - "native/ym2413/examples/serial_am_lfo_trace.rs"
      - "native/ym2413/examples/pg_serial_trace.rs"
      - "tools/ym2413-nuked-oracle/trace.c"
      - ".github/workflows/ym2413-pg-differential.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg-differential:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Rust implementation
        uses: actions/checkout@v4

      - name: Checkout pinned Nuked-OPLL reference
        env:
          NUKED_SHA: 1269cf5a783b65583b50fa2464d08be75830aaa0
        run: |
          git clone https://github.com/nukeykt/Nuked-OPLL.git "$RUNNER_TEMP/Nuked-OPLL"
          git -C "$RUNNER_TEMP/Nuked-OPLL" checkout "$NUKED_SHA"
          test "$(git -C "$RUNNER_TEMP/Nuked-OPLL" rev-parse HEAD)" = "$NUKED_SHA"

      - name: Instrument pinned Nuked operator boundary
        run: |
          python3 - "$RUNNER_TEMP/Nuked-OPLL/opll.c" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          include = '#include "opll.h"\n'
          if source.count(include) != 1:
              raise SystemExit("pinned Nuked header include anchor changed")
          source = source.replace(
              include,
              include
              + "\nuint16_t opll_trace_pg_out_before_operator = 0;"
              + "\nuint16_t opll_trace_operator_phase_index = 0;"
              + "\nint16_t opll_trace_operator_output = 0;"
              + "\nuint8_t opll_trace_selected_instr = 0;"
              + "\nuint8_t opll_trace_selected_op = 0;"
              + "\nuint8_t opll_trace_testmode_at_dolfo = 0;"
              + "\nuint8_t opll_trace_rm_enable_before_operator = 0;\n",
              1,
          )
          stage = "    OPLL_PhaseGenerate(chip);\n\n    OPLL_Operator(chip);"
          if source.count(stage) != 1:
              raise SystemExit("pinned Nuked PhaseGenerate/Operator boundary changed")
          source = source.replace(
              stage,
              "    OPLL_PhaseGenerate(chip);\n"
              "    opll_trace_pg_out_before_operator = chip->pg_out;\n"
              "    opll_trace_rm_enable_before_operator = (uint8_t)chip->rm_enable;\n\n"
              "    OPLL_Operator(chip);",
              1,
          )
          selection = "    OPLL_PreparePatch1(chip);\n\n    OPLL_Channel(chip);"
          if source.count(selection) != 1:
              raise SystemExit("pinned Nuked PreparePatch1/Channel boundary changed")
          source = source.replace(
              selection,
              "    OPLL_PreparePatch1(chip);\n"
              "    opll_trace_selected_instr = chip->inst[ch_offset[chip->cycles]];\n"
              "    opll_trace_selected_op = ((chip->cycles + 1) / 3) & 1;\n\n"
              "    OPLL_Channel(chip);",
              1,
          )
          lfo_stage = "    OPLL_DoLFO(chip);"
          if source.count(lfo_stage) != 1:
              raise SystemExit("pinned Nuked DoLFO boundary changed")
          source = source.replace(
              lfo_stage,
              "    opll_trace_testmode_at_dolfo = chip->testmode;\n"
              "    OPLL_DoLFO(chip);",
              1,
          )
          phase = (
              "    if (phase & 0x100) {\n"
              "        phase ^= 0xff;\n"
              "    }\n"
              "    chip->op_logsin = logsinrom[phase & 0xff];"
          )
          if source.count(phase) != 1:
              raise SystemExit("pinned Nuked operator phase mirror anchor changed")
          source = source.replace(
              phase,
              "    if (phase & 0x100) {\n"
              "        phase ^= 0xff;\n"
              "    }\n"
              "    opll_trace_operator_phase_index = (uint16_t)phase;\n"
              "    chip->op_logsin = logsinrom[phase & 0xff];",
              1,
          )
          output = (
              "    if (!chip->eg_silent && (chip->op_neg&2)) {\n"
              "        output = ~output;\n"
              "    }\n\n"
              "    level = chip->op_logsin+(chip->eg_out<<4);"
          )
          if source.count(output) != 1:
              raise SystemExit("pinned Nuked operator output boundary anchor changed")
          source = source.replace(
              output,
              "    if (!chip->eg_silent && (chip->op_neg&2)) {\n"
              "        output = ~output;\n"
              "    }\n"
              "    opll_trace_operator_output = output;\n\n"
              "    level = chip->op_logsin+(chip->eg_out<<4);",
              1,
          )
          path.write_text(source, encoding="utf-8")
          PY

      - name: Compile external Nuked trace adapter
        run: |
          cc -std=c11 -O2 -Wall -Wextra -DYM2413_TRACE_OPERATOR_BOUNDARY \
            -I"$RUNNER_TEMP/Nuked-OPLL" \
            tools/ym2413-nuked-oracle/trace.c \
            "$RUNNER_TEMP/Nuked-OPLL/opll.c" \
            -o "$RUNNER_TEMP/ym2413-nuked-trace"

      - name: Generate all-channel serial operator differential sequence
        run: |
          python3 - "$RUNNER_TEMP/operator-events.csv" <<'PY'
          import csv
          import sys

          events = []
          def write_register(address, value, call):
              events.append((call, 0, address))
              events.append((call + 2, 1, value))

          patch = (0xE1, 0xA2, 0x55, 0x5D, 0xF3, 0xE4, 0xA5, 0xB6)
          for index, value in enumerate(patch):
              write_register(index, value, index * 40)

          fnums = [32, 64, 128, 192, 256, 320, 384, 448, 511]
          blocks = [min(channel, 7) for channel in range(9)]
          base = 400
          for channel, (fnum, block) in enumerate(zip(fnums, blocks, strict=True)):
              writes = (
                  (0x10 + channel, fnum & 0xFF),
                  (0x20 + channel, 0x10 | ((block & 7) << 1) | ((fnum >> 8) & 1)),
                  (0x30 + channel, 0x00),  # live user patch, maximum carrier volume
              )
              for address, value in writes:
                  write_register(address, value, base)
                  base += 40

          for channel, (fnum, block) in enumerate(zip(fnums, blocks, strict=True)):
              write_register(0x20 + channel,
                             ((block & 7) << 1) | ((fnum >> 8) & 1),
                             4000 + channel * 20)
              write_register(0x20 + channel,
                             0x10 | ((block & 7) << 1) | ((fnum >> 8) & 1),
                             5000 + channel * 20)

          write_register(0x14, 0x1F, 6000)
          write_register(0x34, 0x0F, 6040)
          write_register(0x0F, 0x01, 7000)
          write_register(0x0F, 0x08, 7200)
          write_register(0x0F, 0x02, 7400)
          write_register(0x0F, 0x04, 7600)
          write_register(0x0F, 0x00, 7800)

          live_patch = (0xD1, 0xB2, 0x35, 0x1D, 0xC7, 0xE4, 0xA5, 0x96)
          for index, value in enumerate(live_patch):
              write_register(index, value, 8600 + index * 40)
          for index, (fnum, block) in enumerate(((0x155, 5), (0x0A3, 2), (0x1C1, 6))):
              channel = (0, 4, 8)[index]
              write_register(0x10 + channel, fnum & 0xFF, 9100 + index * 80)
              write_register(0x20 + channel,
                             0x10 | ((block & 7) << 1) | ((fnum >> 8) & 1),
                             9140 + index * 80)
          write_register(0x30, 0x0D, 9400)
          write_register(0x38, 0x0B, 9440)

          events.sort()
          if any(events[index][0] >= events[index + 1][0]
                 for index in range(len(events) - 1)):
              raise ValueError("operator events must have unique, increasing call indices")
          with open(sys.argv[1], "w", newline="", encoding="utf-8") as stream:
              writer = csv.writer(stream)
              writer.writerow(("# call_index", "port", "value"))
              writer.writerows(events)
          PY
          "$RUNNER_TEMP/ym2413-nuked-trace" --calls 147456 \
            --events "$RUNNER_TEMP/operator-events.csv" \
            > "$RUNNER_TEMP/nuked-operator.jsonl"

      - name: Generate all-preset serial latch characterization sequence
        run: |
          python3 - "$RUNNER_TEMP/preset-events.csv" <<'PY'
          import csv
          import sys

          events = []
          def write_register(address, value, call):
              events.append((call, 0, address))
              events.append((call + 2, 1, value))

          patch = (0xE1, 0xA2, 0x55, 0x5D, 0xF3, 0xE4, 0xA5, 0xB6)
          for index, value in enumerate(patch):
              write_register(index, value, index * 40)

          fnums = [32, 64, 128, 192, 256, 320, 384, 448, 511]
          for channel, fnum in enumerate(fnums):
              block = min(channel, 7)
              write_register(0x10 + channel, fnum & 0xFF, 400 + channel * 120)
              write_register(0x20 + channel,
                             0x10 | ((block & 7) << 1) | ((fnum >> 8) & 1),
                             440 + channel * 120)
              write_register(0x30 + channel, channel << 4, 480 + channel * 120)

          for instrument in range(9, 16):
              channel = instrument - 8
              volume = (instrument * 3) & 0x0F
              write_register(0x30 + channel, (instrument << 4) | volume,
                             8200 + (instrument - 9) * 40)

          live_patch = (0xD1, 0xB2, 0x35, 0x1D, 0xC7, 0xE4, 0xA5, 0x96)
          for index, value in enumerate(live_patch):
              write_register(index, value, 8600 + index * 40)

          events.sort()
          if any(events[index][0] >= events[index + 1][0]
                 for index in range(len(events) - 1)):
              raise ValueError("preset events must have unique increasing call indices")
          with open(sys.argv[1], "w", newline="", encoding="utf-8") as stream:
              writer = csv.writer(stream)
              writer.writerow(("# call_index", "port", "value"))
              writer.writerows(events)
          PY
          "$RUNNER_TEMP/ym2413-nuked-trace" --calls 147456 \
            --events "$RUNNER_TEMP/preset-events.csv" \
            > "$RUNNER_TEMP/nuked-presets.jsonl"
          cargo run --quiet --locked \
            --manifest-path native/ym2413/Cargo.toml \
            --example pg_serial_trace -- \
            "$RUNNER_TEMP/preset-events.csv" 147456 \
            > "$RUNNER_TEMP/rust-presets.jsonl"
          python3 tools/ym2413-nuked-oracle/compare_preset_latches.py \
            --nuked-trace "$RUNNER_TEMP/nuked-presets.jsonl" \
            --rust-trace "$RUNNER_TEMP/rust-presets.jsonl"

      - name: Differentially validate serial operator and feedback state
        run: |
          python3 tools/ym2413-nuked-oracle/compare_operator.py \
            --nuked-trace "$RUNNER_TEMP/nuked-operator.jsonl"

      - name: Generate all-five-voice Rhythm Mode operator sequence
        run: |
          python3 - "$RUNNER_TEMP/rhythm-events.csv" <<'PY'
          import csv
          import sys

          events = []
          def write_register(address, value, call):
              events.append((call, 0, address))
              events.append((call + 2, 1, value))

          base = 0
          # Yamaha application manual Table III-9 rhythm frequency setup:
          # R#16/17/18 = 20/50/C0 and R#26/27/28 = 05/05/01.
          # KEY-ON bits in R#26-R#28 remain clear in Rhythm Mode.
          for address, value in (
              (0x16, 0x20), (0x17, 0x50), (0x18, 0xC0),
              (0x26, 0x05), (0x27, 0x05), (0x28, 0x01),
              (0x36, 0x00), (0x37, 0x00), (0x38, 0x00),
          ):
              write_register(address, value, base)
              base += 40

          # Rhythm enable plus BD, SD, TOM, TC and HH key-on bits.
          write_register(0x0E, 0x3F, base + 200)
          events.sort()
          if any(events[i][0] >= events[i + 1][0] for i in range(len(events) - 1)):
              raise ValueError("rhythm events must have unique increasing call indices")
          with open(sys.argv[1], "w", newline="", encoding="utf-8") as stream:
              writer = csv.writer(stream)
              writer.writerow(("# call_index", "port", "value"))
              writer.writerows(events)
          PY
          "$RUNNER_TEMP/ym2413-nuked-trace" --calls 147456 \
            --events "$RUNNER_TEMP/rhythm-events.csv" \
            > "$RUNNER_TEMP/nuked-rhythm-operator.jsonl"

      - name: Differentially validate all five serial rhythm output latches
        run: |
          python3 tools/ym2413-nuked-oracle/compare_operator.py \
            --nuked-trace "$RUNNER_TEMP/nuked-rhythm-operator.jsonl" \
            --require-rhythm

      - name: Differentially validate serial AM LFO shift/carry state
        run: |
          python3 tools/ym2413-nuked-oracle/compare_am_lfo.py \
            --nuked-trace "$RUNNER_TEMP/nuked-operator.jsonl"

      - name: Replay integrated Rust PG EG AM and operator pipeline
        run: |
          cargo run --quiet --locked \
            --manifest-path native/ym2413/Cargo.toml \
            --example pg_serial_trace -- \
            "$RUNNER_TEMP/operator-events.csv" 147456 \
            > "$RUNNER_TEMP/rust-fm3.jsonl"

      - name: Differentially validate integrated FM-3 pipeline
        run: |
          python3 tools/ym2413-nuked-oracle/compare_fm3_integrated.py \
            --nuked-trace "$RUNNER_TEMP/nuked-operator.jsonl" \
            --rust-trace "$RUNNER_TEMP/rust-fm3.jsonl"

      - name: Generate multi-voice Rhythm Mode register sequence
        run: |
          python3 - "$RUNNER_TEMP/rhythm-integrated-events.csv" <<'PY'
          import csv
          import sys

          events = []
          def write_register(address, value, call):
              events.append((call, 0, address))
              events.append((call + 2, 1, value))

          base = 0
          # Yamaha application manual Table III-9 rhythm frequency setup.
          # R#26-R#28 contain no melodic KEY-ON bit while RHY is active.
          for address, value in (
              (0x16, 0x20), (0x17, 0x50), (0x18, 0xC0),
              (0x26, 0x05), (0x27, 0x05), (0x28, 0x01),
              (0x36, 0x00), (0x37, 0x00), (0x38, 0x00),
          ):
              write_register(address, value, base)
              base += 16

          # Rhythm mode with individual percussion triggers, then simultaneous voices.
          write_register(0x0E, 0x20, 1800)
          for call, control in (
              (3000, 0x21),
              (11000, 0x22),
              (19000, 0x24),
              (27000, 0x28),
              (35000, 0x30),
              (43000, 0x3F),
              (80000, 0x20),
              (90000, 0x3F),
          ):
              write_register(0x0E, control, call)

          events.sort()
          if any(events[i][0] >= events[i + 1][0] for i in range(len(events) - 1)):
              raise ValueError("rhythm events must have unique increasing call indices")
          with open(sys.argv[1], "w", newline="", encoding="utf-8") as stream:
              writer = csv.writer(stream)
              writer.writerow(("# call_index", "port", "value"))
              writer.writerows(events)
          PY

      - name: Capture Nuked full Rhythm Mode reference
        run: |
          "$RUNNER_TEMP/ym2413-nuked-trace" --calls 147456 \
            --events "$RUNNER_TEMP/rhythm-integrated-events.csv" \
            > "$RUNNER_TEMP/nuked-rhythm-integrated.jsonl"

      - name: Capture production Rust integrated Rhythm Mode state
        run: |
          cargo run --quiet --locked \
            --manifest-path native/ym2413/Cargo.toml \
            --example pg_serial_trace -- \
            "$RUNNER_TEMP/rhythm-integrated-events.csv" 147456 0 \
            > "$RUNNER_TEMP/rust-rhythm-integrated.jsonl"

      - name: Characterize integrated Rhythm Mode control and synthesis against Nuked
        run: |
          python3 tools/ym2413-nuked-oracle/compare_rhythm_integrated.py \
            --nuked-trace "$RUNNER_TEMP/nuked-rhythm-integrated.jsonl" \
            --rust-trace "$RUNNER_TEMP/rust-rhythm-integrated.jsonl"

      - name: Generate all-channel melodic register sequence
        run: |
          python3 - "$RUNNER_TEMP/events.csv" <<'PY'
          import csv
          import sys

          fnums = [32, 64, 128, 192, 256, 320, 384, 448, 511]
          events = []
          call_index = 0
          for channel, fnum in enumerate(fnums):
              block = min(channel, 7)
              writes = (
                  (0x10 + channel, fnum & 0xFF),
                  (0x20 + channel, ((block & 7) << 1) | ((fnum >> 8) & 1)),
                  (0x30 + channel, 0x10),  # instrument 1, volume 0
              )
              for address, value in writes:
                  events.append((call_index, 0, address))
                  events.append((call_index + 2, 1, value))
                  call_index += 40

          with open(sys.argv[1], "w", newline="", encoding="utf-8") as stream:
              writer = csv.writer(stream)
              writer.writerow(("# call_index", "port", "value"))
              writer.writerows(events)
          PY
          "$RUNNER_TEMP/ym2413-nuked-trace" --calls 147456 --pg-phase-only \
            --events "$RUNNER_TEMP/events.csv" > "$RUNNER_TEMP/nuked-pg-phase.jsonl"

      - name: Compare every captured PG increment with production Rust
        run: |
          python3 tools/ym2413-nuked-oracle/compare_pg.py \
            --nuked-trace "$RUNNER_TEMP/nuked-pg-phase.jsonl"

      - name: Compare all 18 accumulated PG phases with production Rust
        run: |
          python3 tools/ym2413-nuked-oracle/compare_pg_phase.py \
            --nuked-trace "$RUNNER_TEMP/nuked-pg-phase.jsonl"

      - name: Generate serial PG events using the user instrument patch
        run: |
          python3 - "$RUNNER_TEMP/serial-events.csv" <<'PY'
          import csv
          import sys

          fnums = [32, 64, 128, 192, 256, 320, 384, 448, 511]
          events = []
          call_index = 0

          # User patch: modulator MUL=1 + VIB, carrier MUL=2.
          patch = (0x41, 0x02, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00)
          for address, value in enumerate(patch):
              events.append((call_index, 0, address))
              events.append((call_index + 2, 1, value))
              call_index += 40

          for channel, fnum in enumerate(fnums):
              block = min(channel, 7)
              writes = (
                  (0x10 + channel, fnum & 0xFF),
                  (0x20 + channel, ((block & 7) << 1) | ((fnum >> 8) & 1)),
                  (0x30 + channel, 0x00),
              )
              for address, value in writes:
                  events.append((call_index, 0, address))
                  events.append((call_index + 2, 1, value))
                  call_index += 40

          # Exercise serial EG -> DOKON -> delayed PG phase reset on channel 8.
          events.extend(
              (
                  (5000, 0, 0x28),
                  (5002, 1, 0x1F),
                  (5200, 0, 0x28),
                  (5202, 1, 0x0F),
              )
          )

          with open(sys.argv[1], "w", newline="", encoding="utf-8") as stream:
              writer = csv.writer(stream)
              writer.writerow(("# call_index", "port", "value"))
              writer.writerows(events)
          PY
          "$RUNNER_TEMP/ym2413-nuked-trace" --calls 147456 --pg-phase-only --events "$RUNNER_TEMP/serial-events.csv" > "$RUNNER_TEMP/nuked-pg-serial.jsonl"

      - name: Compare integrated core-owned serial PG service with Nuked
        run: |
          python3 tools/ym2413-nuked-oracle/compare_pg_serial.py --nuked-trace "$RUNNER_TEMP/nuked-pg-serial.jsonl" --events "$RUNNER_TEMP/serial-events.csv"

      - name: Generate controlled KEY-ON and KEY-OFF events
        run: |
          python3 - "$RUNNER_TEMP/keyon-events.csv" <<'PY'
          import csv
          import sys

          fnums = [32, 64, 128, 192, 256, 320, 384, 448, 511]
          events = []
          call_index = 0
          for channel, fnum in enumerate(fnums):
              block = min(channel, 7)
              writes = (
                  (0x10 + channel, fnum & 0xFF),
                  (0x20 + channel, ((block & 7) << 1) | ((fnum >> 8) & 1)),
                  (0x30 + channel, 0x10),
              )
              for address, value in writes:
                  events.append((call_index, 0, address))
                  events.append((call_index + 2, 1, value))
                  call_index += 40

          # Assert KEY-ON on channel 8, then clear it after the envelope has advanced.
          events.extend(((1200, 0, 0x28), (1202, 1, 0x1F),
                         (1400, 0, 0x28), (1402, 1, 0x0F)))
          with open(sys.argv[1], "w", newline="", encoding="utf-8") as stream:
              writer = csv.writer(stream)
              writer.writerow(("# call_index", "port", "value"))
              writer.writerows(events)
          PY
          "$RUNNER_TEMP/ym2413-nuked-trace" --calls 2600 --pg-phase-only \
            --events "$RUNNER_TEMP/keyon-events.csv" > "$RUNNER_TEMP/nuked-keyon-phase.jsonl"

      - name: Compare phase accumulator reset after KEY-ON
        run: |
          python3 tools/ym2413-nuked-oracle/compare_pg_phase.py \
            --nuked-trace "$RUNNER_TEMP/nuked-keyon-phase.jsonl" \
            --allow-partial --require-reset-event

      - name: Run pinned MAME/ymfm source-level PG arithmetic audit
        run: |
          python3 tools/ym2413-nuked-oracle/compare_mame_pg.py
