name: Z80 External CPU Conformance

on:
  pull_request:
    paths:
      - "native/sms_core/**"
      - "tools/z80test/**"
      - ".github/workflows/z80-external-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: z80-external-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  z80test:
    name: Run pinned external Z80 suite against SMS CPU core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install --yes cmake g++
      - name: Run upstream Z80 full conformance suite
        run: python3 tools/z80test/run_sms_z80test.py --variant z80full --max-steps 250000000
