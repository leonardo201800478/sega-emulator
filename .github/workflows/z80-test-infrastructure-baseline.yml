name: Z80 Test Infrastructure Baseline

on:
  push:
    branches:
      - audit/z80-test-infrastructure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-z80-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff

      - name: Run focused Z80 regression tests
        run: |
          python -m pytest -q \
            tests/unit/test_z80.py \
            tests/unit/test_z80_alu_exhaustive.py \
            tests/unit/test_z80_bit_flags_exhaustive.py \
            tests/unit/test_z80_daa_exhaustive.py \
            tests/unit/test_z80_indexed_bit_flags.py

      - name: Generate opcode dispatch inventory
        if: always()
        run: |
          mkdir -p artifacts/z80
          python tools/z80_opcode_inventory.py --json > artifacts/z80/opcode-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/z80/opcode-inventory.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          print("Dispatch inventory summary (not semantic coverage):")
          for space, counts in report["by_space"].items():
              print(
                  f'{space}: total={counts["total"]}, '
                  f'executed={counts["executed"]}, '
                  f'unsupported={counts["unsupported"]}, '
                  f'unexpected_error={counts["unexpected_error"]}'
              )
          errors = report.get("unexpected_errors", [])
          if errors:
              raise SystemExit(f"{len(errors)} unexpected opcode dispatch errors")
          PY

      - name: Upload Z80 baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z80-test-infrastructure-baseline
          path: artifacts/z80/
          if-no-files-found: warn
          retention-days: 30
