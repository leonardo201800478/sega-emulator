[workspace]
resolver = "3"
exclude = [
    "native/audio_output",
]
members = [
    "native/sg1000_core",
    "native/sms_core",
    "native/z80_cpu",
    "native/sn76489",
    "native/z80_alu",
    "native/z80_bus",
    "native/audio_runtime",
    "native/input_runtime",
    "native/temporal_core",
    "native/machine_scheduler",
    "native/video_runtime",
    "native/video_core",
    "native/observability",
    "rust/runtime/sms-runtime",
]
default-members = [
    "native/sg1000_core",
    "native/sms_core",
    "native/z80_cpu",
    "native/sn76489",
    "native/z80_alu",
    "native/z80_bus",
    "native/audio_runtime",
    "native/input_runtime",
    "native/temporal_core",
    "native/machine_scheduler",
    "native/video_runtime",
    "native/observability",
    "rust/runtime/sms-runtime",
]

[workspace.dependencies]
sega-observability = { path = "native/observability" }
