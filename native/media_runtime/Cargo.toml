[package]
name = "sega-media"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared Sega ROM identity, DAT catalog, and cartridge hardware profiles"

[lib]
name = "sega_media"
path = "src/lib.rs"

[dependencies]
crc32fast = "1.5.4"
hex = "0.4.3"
quick-xml = "0.41.0"
serde = { version = "1.0.229", features = ["derive"] }
sha1 = { version = "0.11.0", default-features = false, features = ["std"] }
sha2 = { version = "0.11.1", default-features = false, features = ["std"] }
