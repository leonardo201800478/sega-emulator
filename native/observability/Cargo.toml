[package]
name = "sega-observability"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
description = "Shared structured logging and diagnostics infrastructure for Sega Emulator"

[features]
default = []
runtime = [
    "dep:serde",
    "dep:serde_json",
    "dep:tracing-appender",
    "dep:tracing-subscriber",
]

[dependencies]
tracing = "=0.1.44"
serde = { version = "=1.0.229", features = ["derive"], optional = true }
serde_json = { version = "=1.0.154", optional = true }
tracing-appender = { version = "=0.2.5", optional = true }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "json", "registry", "std", "time"], optional = true }
