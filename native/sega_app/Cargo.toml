[package]
name = "sega-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace]
resolver = "3"

[target.'cfg(windows)'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wgpu", "wayland", "x11"] }
raw-window-handle = "=0.6.2"
rfd = "=0.17.2"
zip = { version = "=9.4.1", default-features = false, features = ["deflate"] }
sega-video-runtime = { path = "../video_runtime" }
sega-sms-runtime = { path = "../../rust/runtime/sms-runtime" }
sega-sms-core = { path = "../sms_core" }
sega-audio-output = { path = "../audio_output" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
