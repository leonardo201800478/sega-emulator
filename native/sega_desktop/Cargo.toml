[package]
name = "sega-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[target.'cfg(windows)'.dependencies]
sega-sms-runtime = { path = "../../rust/runtime/sms-runtime" }
sega-audio-output = { path = "../audio_output" }
sega-video-runtime = { path = "../video_runtime" }
slint = { version = "~1.18", default-features = false, features = [
    "compat-1-18",
    "std",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "unstable-wgpu-30",
] }
md-icons-classic = "=0.4.0"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_code = "deny" # Slint macros locally allow generated unsafe glue; handwritten unsafe remains denied.
unused_must_use = "deny"

[lints.clippy]
all = "warn"
