[package]
name = "sega-sms-debugger"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace]
resolver = "3"

[target.'cfg(windows)'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
rfd = "=0.17.2"
sega-debugger-core = { path = "../debugger_core" }
sega-sms-core = { path = "../sms_core" }
sega-z80-cpu = { path = "../z80_cpu" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
