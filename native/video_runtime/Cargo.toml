[package]
name = "sega-video-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "sega_video_runtime"
path = "src/lib.rs"

[features]
default = []
d3d12-host = ["dep:windows"]

[dependencies]
sega-observability.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }

[[example]]
name = "d3d12_frame_smoke"
required-features = ["d3d12-host"]

[[example]]
name = "d3d12_session_smoke"
required-features = ["d3d12-host"]
