[package]
name = "sega-z80-core"
version = "0.1.1"
edition = "2024"
publish = false

[lib]
name = "sega_z80_core"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
python-extension = ["pyo3/extension-module"]

[dependencies]
pyo3 = "0.27"
sega-sg1000-core = { path = "../sg1000_core" }
sega-sms-core = { path = "../sms_core" }
sega-audio-runtime = { path = "../audio_runtime" }
sega-audio-output = { path = "../audio_output" }
