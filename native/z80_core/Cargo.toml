[package]
name = "sega-z80-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "sega_z80_core"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
python-extension = ["pyo3/extension-module"]

[dependencies]
pyo3 = "0.27"
sega-z80-alu = { path = "../z80_alu" }
sega-sg1000-core = { path = "../sg1000_core" }
