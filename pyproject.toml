[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sega-emulator"
version = "0.1.1"
license = "MIT"
license-files = ["LICENSE"]
description = "Sega emulator application with Rust-native hardware cores."
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = []

[project.optional-dependencies]
dev = [
    "maturin==1.16.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]
qt = [
    "PySide6==6.12.0",
    "numpy==2.5.4",
]

[tool.uv]
required-version = "==0.13.7"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sega_emulator.frontend.qt" = ["assets/*.svg", "assets/systems/*.svg"]

[tool.setuptools.data-files]
"share/sega-emulator/dats" = ["dats/*.dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
extend-exclude = ["legacy/**", "tools/audits/*.ipynb"]
target-version = "py315"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/sega_emulator/frontend/qt/localization.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
