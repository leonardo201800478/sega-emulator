[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sega-emulator"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Reference emulator core for Sega systems, starting with SG-1000."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]
frontend = [
    "pygame-ce>=2.5.3,<3.0",
]
qt = [
    "PySide6>=6.8,<7",
    "pygame-ce>=2.5.3,<3.0",
    "PySDL3==0.9.12b1",
    "sounddevice>=0.5.3,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
# Ruff does not format notebook JSON as a standalone source file in this project.
extend-exclude = ["tools/audits/*.ipynb"]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
