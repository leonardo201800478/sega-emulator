[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sega-emulator"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Sega emulator application with Rust-native hardware cores."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]
qt = [
    "PySide6>=6.8,<7",
    "numpy>=2.3,<3",
    "PySDL3==0.9.12b1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sega_emulator.frontend.qt" = ["assets/*.svg", "assets/systems/*.svg"]

[tool.setuptools.data-files]
"share/sega-emulator/dats" = ["dats/*.dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
extend-exclude = ["legacy/**", "tools/audits/*.ipynb"]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/sega_emulator/frontend/qt/localization.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
