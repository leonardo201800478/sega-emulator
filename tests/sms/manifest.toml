# External SMS diagnostic suites.
# This is provenance metadata, not a claim that a suite has been executed.
# Revisions are immutable upstream commit SHAs.

[[suite]]
id = "smsmemtest"
name = "SMSmemtest"
upstream = "https://github.com/sverx/SMSmemtest"
revision = "12771ed247b93d3a83d0c3cbe7d2d39e3ccb47d9"
devkitsms_revision = "561bc2cb9829cdf2e31ad8cd43835037c8c44a63"
license = "Unlicense"
license_evidence = "Upstream LICENSE.md"
scope = ["system_ram_8k", "vram_16k", "cartridge_ram"]
execution_gate = "PROMPT_AND_COLOR_PIPELINE_VALIDATION_REQUIRED; CART_SRAM_BLOCKED_CAPABILITY"
redistribution = "permissive_under_unlicense_with_attribution"
notes = "Upstream v0.40 uses controller waits between RAM/VRAM/SRAM phases and displays per-case OK/FAILED text. Frame-boundary input and green/red framebuffer classifiers are implemented but not validated against a built ROM. SMSlib input semantics are audited at devkitSMS revision 561bc2cb9829cdf2e31ad8cd43835037c8c44a63. Runtime has no cartridge SRAM backing store, so SRAM bank tests are BLOCKED_CAPABILITY. Build requires pinned devkitSMS/SDCC and modified crt0."

[[suite]]
id = "sms_test_suite"
name = "SMS Test Suite"
upstream = "https://github.com/sverx/SMSTestSuite"
revision = "985bc04fef6f3dc3c3450fbc84242676f241d316"
license = "UNSPECIFIED_AT_AUDITED_REVISION"
license_evidence = "No explicit root LICENSE file was found during this audit; verify upstream before redistribution."
scope = ["video_patterns", "psg_audio", "fm_audio", "controllers", "paddle", "system_identification"]
execution_gate = "RUNNER_AVAILABLE_BUILD_DEPENDENCIES_AND_CASE_ORACLES_NOT_VALIDATED"
redistribution = "LOCAL_TESTING_ONLY_PENDING_LICENSE_CLARIFICATION"
notes = "Source revision corresponds to v0.38. Build depends on external SMSlib/PSGlib and related libraries; pin every dependency before creating a reproducible build."

[[suite]]
id = "sms_vdp_test"
name = "SmsVdpTest"
upstream = "https://github.com/FluBBaOfWard/SmsVdpTest"
revision = "490c00b38c83012dee5a7a582097f080c210a3e7"
license = "UNSPECIFIED_AT_AUDITED_REVISION"
license_evidence = "No explicit license file was found during this audit; verify upstream before redistribution."
scope = ["vdp_ports", "vram_cram_protocol", "h_v_counters", "vint_hint", "sprite_collision", "sprite_overflow"]
execution_gate = "RUNNER_AVAILABLE_CASE_LEVEL_VDP_CAPABILITY_REQUIRED"
redistribution = "LOCAL_TESTING_ONLY_PENDING_LICENSE_CLARIFICATION"
notes = "Upstream README asks for ZEXALL or at least ZEXDOC and exactly 228 CPU cycles per scanline. The current VDP slice lacks dot/fetch arbitration and sub-scanline effects, so timing-sensitive cases are blocked."

